name: Muslin report
description: You sewed a muslin (test garment) from a PublicSewing design. Tell us how it went.
title: "Muslin: <design>, <size set or own measurements>"
labels: [muslin-report]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing. **Everything in this issue is public**: leave out anything you'd
        rather not share, and crop faces from photos.
  - type: dropdown
    id: design
    attributes:
      label: Design
      options:
        - Chore coat (chore-coat)
        - Mackinaw (mackinaw)
        - Peacoat (peacoat)
        - Hunting coat (hunting-coat)
        - Norfolk jacket (norfolk-jacket)
        - Military tunic (military-tunic)
        - Boys' work coat (boys-work-coat)
        - Barber's coat (barbers-coat)
        - Painter's jacket (painters-jacket)
        - Work aprons (aprons)
        - Shop coat (shop-coat)
        - Bar vest (bar-vest)
        - T-shirt (t-shirt)
        - Nightshirt (nightshirt)
        - Dressing gown (dressing-gown)
        - Nightgown (nightgown)
        - Children's smock (childrens-smock)
        - Frock (frock)
        - Pinafore (pinafore)
        - Bloomers (bloomers)
        - Shirtwaist dress (shirtwaist-dress)
        - Tailored jacket (tailored-jacket)
        - Kimono jacket (kimono-jacket)
        - Women's box coat (womens-box-coat)
        - Gored skirt (gored-skirt)
        - Pleated skirt (pleated-skirt)
        - Circular skirt (circular-skirt)
        - Kimono dress (kimono-dress)
        - Windbreaker (windbreaker)
        - Quilted jacket (quilted-jacket)
        - Winter coat (winter-coat)
        - Topcoat (topcoat)
        - Surtout (surtout)
        - Fitted overcoat (fitted-overcoat)
        - Raincoat (raincoat)
        - Princess coat (princess-coat)
        - Prince Albert jacket (prince-albert-jacket)
        - Cape (cape)
        - Cape overcoat (cape-overcoat)
        - Dolman cape (dolman-cape)
        - Suit jacket (suit-jacket)
        - Scout coat (scout-coat)
        - Smoking jacket (smoking-jacket)
        - Eton jacket (eton-jacket)
        - Waistcoat (waistcoat)
        - Double-breasted waistcoat (db-waistcoat)
        - Suit trousers (suit-trousers)
        - Sailor pants (sailor-pants)
        - Golf pants (golf-pants)
        - Scout pants (scout-pants)
        - Drawers (drawers)
        - Kilt (kilt)
        - Dress shirt (dress-shirt)
        - Button-on middy (button-middy)
        - Anorak (anorak)
        - Balmacaan (balmacaan)
        - Bib overall (bib-overall)
        - Box overcoat (box-overcoat)
        - Boys' knickers (boys-knickers)
        - Boys' suit jacket (boys-suit-jacket)
        - Breeches (breeches)
        - Culottes (culottes)
        - Divided riding skirt (riding-skirt)
        - Apron riding skirt (apron-riding-skirt)
        - Double-dart jacket (double-dart-jacket)
        - Field jacket (field-jacket)
        - Field trousers (field-trousers)
        - Fitted jacket (fitted-jacket)
        - Gathered skirt (gathered-skirt)
        - Girls' coat (girls-coat)
        - Jumpsuit (jumpsuit)
        - Knee pants (knee-pants)
        - Mantle (mantle)
        - Middy blouse (middy-blouse)
        - Overall pants (overall-pants)
        - Overcoat (overcoat)
        - Peg-top pants (peg-pants)
        - Pyjama jacket (pyjama-jacket)
        - Pyjama trousers (pyjama-trousers)
        - Service shirt (service-shirt)
        - Shift dress (shift-dress)
        - Two-piece skirt (two-piece-skirt)
        - Ulster (ulster)
        - Women's peacoat (womens-peacoat)
        - Work pants (work-pants)
        - Work shirt (work-shirt)
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: Size set or own measurements
      description: The size set you picked (e.g. "Men 40", "Girls 7C"), or "own measurements".
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements (optional)
      description: >
        If you used your own, paste them here, or the settings from the PDF's cover page. Optional,
        and public if you do.
      render: yaml
  - type: textarea
    id: options
    attributes:
      label: Options you changed
      description: Any design options or core settings (seam allowance, units) you changed from the defaults.
  - type: input
    id: fabric
    attributes:
      label: Fabric
      description: What the muslin was made of (e.g. medium calico, old bedsheet).
  - type: textarea
    id: fit
    attributes:
      label: What fit
      description: Balance, ease, neck and shoulders, armhole and sleeve, length.
    validations:
      required: true
  - type: textarea
    id: misfit
    attributes:
      label: What didn't fit
      description: >
        Where it pulled, gaped or was too long or short, and by how much. Seams that didn't match
        their partner (which, and by how much). What you changed on the muslin.
    validations:
      required: true
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: Front, side and back, worn. Drag images in here.
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Problems with the pattern tool, the PDF, the instructions.
