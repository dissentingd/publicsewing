  - id: emko-waistcoat-imk-176-100-88
    recipe: recipes/emko/waistcoat_imk.yaml
    data: {garment: data/emko/waistcoat_176-100-88.yaml}
    garment: waistcoat 176-100-88 (ИМК)
    tables: Tables 6.2 (БК) and 6.3 (ИМК, rows 1–27.2)
    status:
      construction: ИМК (model construction), Table 6.3 rows 1–27.2
      sewable: false
      note: >-
        Model construction: back (centre seam, fish dart, shoulder dart eased and shrunk)
        and front (chest dart turned into the armhole and shrunk, waist dart to the hem), in
        gate to the hip. Not yet complete: Table 6.3's МК block (Fig. 32: V-neck, front
        points, back length, a deeper armhole drawn "по модели") isn't built, nor the welt
        pockets. Table 6.2 prints no ДП, so the armhole is reported, not checked.
  - id: emko-waistcoat-mk-176-100-88
    recipe: recipes/emko/waistcoat_mk.yaml
    data: {garment: data/emko/waistcoat_176-100-88.yaml}
    garment: waistcoat 176-100-88 (МК)
    tables: Tables 6.2 (БК) and 6.3 (ИМК and МК)
    status:
      construction: МК (model construction, the finished garment), Table 6.3
      sewable: false
      note: >-
        Not yet test-sewn. These are the drafted pieces of the finished waistcoat (back and
        front with darts, V-neck, button stand, cutaway front, shortened back), and they match
        the book's printed values; whether they fit and sew up well is untested. The armhole is
        "по модели" in the book (drawn, not tabulated) and is traced from Fig. 32. Still to
        add: welt pockets, facings and button positions. Next step: a muslin test (see the
        top of catalog/emko.yaml).
  - id: emko-jacket-imk
    recipe: recipes/emko/jacket_imk.yaml
    # every Table 1.4 figure but 176-100-88, which has its own entry above (from Table 1.2)
    data: {graded: data/emko/jacket_graded.yaml, model: data/emko/jacket_176-100-88.yaml,
           figures: [176-92-74, 176-100-82, 176-100-94, 176-100-100, 176-112-100, 176-112-106, 176-112-112]}
    tables: Tables 1.4 (БК, graded), 1.2 and 1.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 1.3, graded over Table 1.4's typical figures
      sewable: false
      note: >-
        The jacket's model construction for one of Table 1.4's typical figures: the ИМК recipe
        run on that figure's base-construction rows (no garment-specific work). d_т is
        computed from its formula; Table 1.3 prints it for 176-100-88 only, so that check is
        skipped on the other sizes. Not yet complete: the back's rows 37–42.3 and the collar.
  # ---- ИМК/МК graded over Table x.4's typical figures (2026-10-22) ----
  # Data: data/emko/<garment>_graded.yaml (scripts/emko_grade_ocr.py, from OCR) plus the
  # garment's ИМК/МК rows from its 176-100-88 file. Only figures that pass the gate are listed;
  # the others are named with why (a held cell = the reader left it null: misread or misprint,
  # see pilot/emko/FINDINGS.md). 176-100-88 has its own entry above (from Table x.2).
  - id: emko-winter-coat-imk
    recipe: recipes/emko/coat_winter_imk.yaml
    # not listed: 176-92-74, 176-112-100, 176-112-112 (row 24 held: the reads can't tell 1.5 from 1.45)
