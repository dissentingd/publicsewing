           figures: [176-100-82, 176-100-94, 176-100-100, 176-112-106]}
    tables: Tables 3.4 (БК, graded), 3.2 and 3.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 3.3, graded over Table 3.4's typical figures
