    data: {graded: data/emko/jacket_graded.yaml, figure: 176-92-74}
  - id: emko-jacket-imk-176-100-88
    recipe: recipes/emko/jacket_imk.yaml
    data: {garment: data/emko/jacket_176-100-88.yaml}
    garment: jacket 176-100-88 (ИМК)
    tables: Tables 1.2 (БК) and 1.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 1.3
      sewable: false
      note: >-
        Model construction: back, side panel, front (chest/belly dart moved into the pocket
        cut) and two-piece sleeve, all in gate. Not yet complete: the back's rows 37–42.3
        (Table 1.3 p. 15, shoulder/armhole shaping) aren't built, and the collar and lapel
        are "по модели" in the book (not tabulated), so a collar draft is still needed.
  - id: emko-winter-coat-imk-176-100-88
    recipe: recipes/emko/coat_winter_imk.yaml
    data: {garment: data/emko/coat_winter_176-100-88.yaml}
    garment: winter coat 176-100-88 (ИМК)
    tables: Tables 3.2 (БК) and 3.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 3.3
      sewable: false
      note: >-
        Model construction: back yoke, back, front yoke, front (belly taken by turning the
        lower front, side dart in the pocket line) and two-piece sleeve, all in gate. Not
        yet complete: the turn-down collar is "по модели" in the book (not tabulated), so a
        collar draft is still needed; the welt pockets and belt aren't drafted.
  - id: emko-demi-coat-imk-176-100-88
    recipe: recipes/emko/coat_demi_imk.yaml
    data: {garment: data/emko/coat_demi_176-100-88.yaml}
    garment: demi-season coat 176-100-88 (ИМК)
    tables: Tables 2.2 (БК) and 2.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 2.3
      sewable: false
      note: >-
        Model construction: back (shoulder dart eased and shrunk, armhole redrawn), side
        panel, front (chest and belly darts into the pocket cut) and two-piece sleeve, all
        in gate. Not yet complete: the turn-down collar is "по модели" in the book (not
        tabulated), so a collar draft is still needed; the back and sleeve vents, pocket
        flaps and the hem's curve at 94 aren't drafted.
  - id: emko-summer-jacket-imk-176-100-88
    recipe: recipes/emko/summer_jacket_imk.yaml
    data: {garment: data/emko/summer_jacket_176-100-88.yaml}
    garment: summer jacket 176-100-88 (ИМК)
    tables: Tables 4.2 (БК) and 4.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 4.3
      sewable: false
      note: >-
        Model construction: back yoke, back (one piece, centre back on the fold), front
        yoke, front (belly dart to the hem) and one-piece sleeve with an inner seam and an
        elbow dart, all in gate. Not yet complete: the hood (Table 4.2, Figs. 19–20) isn't
        built, and the welt pockets, zip facing, hem and cuff elastic aren't drafted. The
        sleeve hem is straight: the book's arc about O degenerates on the level БК sleeve hem.
  - id: emko-insulated-jacket-imk-176-100-88
    recipe: recipes/emko/jacket_insulated_imk.yaml
    data: {garment: data/emko/jacket_insulated_176-100-88.yaml}
    garment: insulated jacket 176-100-88 (ИМК)
    tables: Tables 5.2 (БК) and 5.3 (ИМК)
    status:
      construction: ИМК (model construction), Table 5.3
      sewable: false
      note: >-
        Model construction: back yoke, back (one piece, centre back on the fold), front
        yoke (sloped seam taking the chest dart), front (cut back for the placket, belly
