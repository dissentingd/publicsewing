# Catalog entries built from ЕМКО СЭВ т.3 (men's base constructions, 1988).
# scripts/catalog_build.py builds each entry only if its pattern passes the gate.
#
# What `status.sewable` means. Passing the gate shows the pattern matches the values the book
# prints; it says nothing about fit or whether the pieces sew together well. So:
#   sewable: false  reference construction, or a complete pattern that has not been test-sewn.
#   sewable: true   only after a muslin test: the pattern was printed at 100%, cut in muslin
#                   (or scrap cloth), sewn, and tried on, and the result is recorded in the
#                   entry as `muslin: {date, sewn_by, result}`. The result should cover whether
#                   the pieces go together, whether it closes, how the armholes and neck sit,
#                   and what was changed. catalog_build.py refuses sewable: true without it.
# A decision to move the project forward is not a muslin test, and neither is the gate.
source:
  book: "ЕМКО СЭВ т.3: Базовые конструкции мужской одежды (1988)"
  corpus: emko                       # corpus/MANIFEST.yaml entry
  rights: >-
    Drafting method; methods are uncopyrightable (project policy). Pattern pieces are
    constructed from the book's tables by ccat. Where the book leaves a curve "по модели"
    and only draws it (the waistcoat МК armhole), that curve is traced from the figure
    (fair use, project policy). Source is a personal copy, processed offline; the book itself
    is not redistributed.
  size_label: "height–chest girth–waist girth, cm (ЕМКО typical figure)"
seam_allowance: 1.5                  # cm, uniform; an export default (the base tables give none)
status:                              # applies to every entry below unless an entry overrides it
  construction: БК (base construction)
  sewable: false
  note: >-
    Reference only, not a sewing pattern. ЕМКО's base construction is the basis for the
    model construction (ИМК): it has no model seams (yokes, side panels), and the sleeve
    is drawn as an upper and an under half (ИМК's top and under sleeve). Sewable entries
    will be built from ИМК.
entries:
  - id: emko-winter-coat-176-100-88
    recipe: recipes/emko/jacket.yaml
    data: {garment: data/emko/coat_winter_176-100-88.yaml}
  - id: emko-insulated-jacket-176-100-88
    recipe: recipes/emko/jacket.yaml
    data: {garment: data/emko/jacket_insulated_176-100-88.yaml}
  - id: emko-summer-jacket-176-100-88
    recipe: recipes/emko/jacket.yaml
    data: {garment: data/emko/summer_jacket_176-100-88.yaml}
  - id: emko-jacket-176-92-74
