# Bib overall: Simons' "Apron Overall" (Drafting Pants and Overalls, 1916, Diagram XII, pp. 22-23),
# on the work pants' Titan legs drafted two sizes larger: no waistband or fly, a bib rising from
# the front waist, the back raised above the waist where the straps cross, side openings
# buttoned at the hips, patch pockets on the bib, hips and seat. See BRIEF.md.
extends: ../work-pants/spec.yaml

about:
  id: bib-overall
  name: Bib overall
  description: Bib-and-brace work overall, side seams buttoned at the hip, bib, hip and back patch pockets
  difficulty: 3
  tags: [bottoms, workwear]
  techniques: [patch-pocket, buttonhole, hem]
  version: 0.1.0
  source: Simons, Drafting Pants and Overalls (1916), Apron Overall, Diagram XII (draftingpantsove00simo)

options:
  # Drafted two sizes larger at the waist and seat (34 waist, 40 seat: 36 and 42), knee 21,
  # bottom 19, rise 11
  seatEase: { pct: 15, max: 20 } # the work pants' 10%, plus 2 in
  waistEase: { pct: 15, max: 20 } # the work pants' 9%, plus 2 in
  crotchDrop: { pct: 6.5 } # x inseam: the work pants' 5%, plus 1/2 in for the 11 in rise
  hemWidth: { pct: 90 } # bottom 19 / knee 21
  bibHeight: { pct: 26, min: 15, max: 35, of: waistToFloor, menu: style } # L to 16, 11 in
  bibWidth: { pct: 32, min: 20, max: 50, of: waist, menu: style } # 16 to 17 doubled, 11 in on a 34 waist
  bibInset: { pct: 5, min: 0, max: 10, of: waist, menu: style } # A to 14, the bib's foot 1 3/4 in in from the side
  backRise: { pct: 12.5, min: 5, max: 20, of: waistToFloor, menu: style } # Y to 2, 5 1/4 in above the waist at CB
  backRiseTop: { pct: 9, min: 5, max: 15, of: waist, menu: style } # 2 to 3, 3 in
  sideOpening: { pct: 20, min: 10, max: 30, of: waistToFloor, menu: style } # A to 6, 6 3/4 in
  strapWidth: { pct: 4.5, min: 3, max: 7, of: waist, menu: style } # 1 1/2 in finished
  bibPocket: { bool: true, menu: style }
  hipPockets: { bool: true, menu: style }
  seatPockets: { bool: true, menu: style }
  # Not on an overall
  sidePockets: { bool: false, menu: false }
  backPocket: { bool: false, menu: false }
  beltLoops: { count: 0, menu: false }
  flyWidth: { pct: 3.5, menu: false }
  waistbandHeight: { pct: 3.75, menu: false }

pieces:
  front:
    prefix: trousers # named like the inherited pieces
    from: titan.front
    hide: tree
    options: all
    measurements: [waistToSeat, hpsToWaistFront, hpsToWaistBack]
    let:
      opening: waistToFloor * sideOpening
    ops:
      - trouserLeg:
          which: front
          dart: 0
          hemWidth: hemWidth
          hemSag: 0
          pocketTop: 0 # the side opening, notched at its foot
          pocketLength: opening
          pocketWidth: 0
          pocketDepth: 0
      # The hip pocket's mouth: from 1 in in from the side, 2 1/4 in below the waist, 5 1/2 in
      # across (Simons' lower side pocket, 10 to 11, is 3 1/2 in wide; made a full hip pocket)
      - markLine: { id: hipPocket, from: [wOut.x + waist * 0.03, wOut.y + waistToSeat * 0.2], to: [wOut.x + waist * 0.03 + seat * 0.14, wOut.y + waistToSeat * 0.2], class: mark dashed, if: hipPockets }
      # Strap length: back rise top, over the shoulder, to the bib's top, plus 6 in to adjust
      - store: { key: trousers.strap, value: hpsToWaistBack - waistToFloor * backRise + hpsToWaistFront - waistToFloor * bibHeight + 150 }
  back:
    prefix: trousers # named like the inherited pieces
    from: titan.back
    after: front
    hide: tree
    options: all
    measurements: [waistToSeat]
    let:
      opening: waistToFloor * sideOpening
    ops:
      - trouserLeg:
          which: back
          matchOutseam: trousers.front.outseam
          dart: 0
          hemWidth: hemWidth
          hemSag: 0
          pocketTop: 0
          pocketLength: opening
      # The seat pocket's mouth, 3 in below the waist, a fifth of the way in from CB
      - markLine: { id: seatPocket, from: [wIn.x * 0.8 + wOut.x * 0.2, (wIn.y + wOut.y) / 2 + waistToSeat * 0.28], to: [wIn.x * 0.8 + wOut.x * 0.2 + seat * 0.15, (wIn.y + wOut.y) / 2 + waistToSeat * 0.28], class: mark dashed, if: seatPockets }
  # No waistband, fly or belt loops
  waistband: { part: strip, after: [back, front], nr: 3, length: 1, width: 1, if: "false" }
  flyShield: { part: strip, after: front, nr: 4, length: 1, width: 1, if: "false" }
  flyFacing: { part: strip, after: front, nr: 5, length: 1, width: 1, if: "false" }
  # The bib: on the fold at CF, sewn to the front waist from CF to bibInset short of the side;
  # cut twice (one facing)
  bib:
    part: polygon
    after: front
    nr: 10
    cut: 2
    fold: 3
    let:
      w: trousers.front.waist - waist * bibInset
      h: waistToFloor * bibHeight
      t: waist * bibWidth / 2
    points: [[0, 0], [w, 0], [t, -h], [0, -h]]
    allowance: [1, 1, 1, 0]
    buttonholes: [[t - 20, -h + 25]]
    lines: [[[t * 0.15, -h * 0.85], [t * 0.15 + waist * 0.15, -h * 0.85]]]
  # The raised back: on the fold at CB, sewn to both backs' waists and on to the bib's foot;
  # cut twice (one facing)
  backRise:
    part: polygon
    after: [back, front]
    nr: 11
    cut: 2
    fold: 3
    let:
      w: trousers.back.waist + waist * bibInset
      h: waistToFloor * backRise
      t: waist * backRiseTop
    points: [[0, 0], [w, 0], [t, -h], [0, -h]]
    allowance: [1, 1, 1, 0]
  strap:
    part: strip
    after: front
    nr: 12
    cut: 2
    fold: true
    length: trousers.strap
    width: waist * strapWidth
  # The side openings: a stand on the back's edge, a facing on the front's, buttoned
  sideStand:
    part: strip
    after: back
    nr: 13
    cut: 2
    fold: true
    length: waistToFloor * sideOpening + 20
    width: 30
  sideFacing:
    part: strip
    after: front
    nr: 14
    cut: 2
    length: waistToFloor * sideOpening + 20
    width: 40
  # Patch pockets: bib 5 by 6 in, hip 5 1/2 by 6 1/2 (Simons' lower side pocket), seat 6 by 7
  bibPocketPiece:
    part: polygon
    after: front
    nr: 15
    if: bibPocket
    let:
      w: waist * 0.15
      h: waist * 0.18
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [3, 1, 1, 1]
  hipPocket:
    part: polygon
    after: front
    nr: 16
    cut: 2
    if: hipPockets
    let:
      w: seat * 0.14
      h: seat * 0.16
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [3, 1, 1, 1]
  seatPocket:
    part: polygon
    after: back
    nr: 17
    cut: 2
    if: seatPockets
    let:
      w: seat * 0.15
      h: seat * 0.175
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [3, 1, 1, 1]
