# Boys' suit jacket: Simons' boys' single-breasted sack coat (Designing Boys' and Juveniles'
# Clothing, 1922, Diagrams 1-2, pp. 18-23), on the jacket (FreeSewing's Bent, three-piece body):
# a three-button suit jacket for boys and youths, notched lapel turning above the waist, flap
# pockets, rounded front corners, no vent, two-piece sleeves. For any size. See BRIEF.md.
extends: ../suit-jacket/spec.yaml

about:
  id: boysjacket
  name: Boys' suit jacket
  category: jackets
  description: "A three-button suit jacket for boys: notched lapel, flap pockets, rounded front corners"
  difficulty: 5
  tags: [jackets, children]
  techniques: [button, welt-pocket, collar, lapel, facing, two-piece-sleeve]
  version: 0.1.0
  source: "Simons, Designing Boys' and Juveniles' Clothing (1922), Diagrams 1-2, pp. 18-23 (designingboysjuv00simo)"
  preview: usdaBoyC6 # the size of the pattern-pieces preview on its page (tools/preview.mjs)

options:
  # Fit: a little roomier than the men's jacket, for growing
  chestEase: { pct: 17 }
  # Style: Simons' size 6 is 20" long on a 10 1/2" waist length: 9 1/2" below the waist
  lengthBelowWaist: { pct: 150 } # x waistToSeat: 9 1/2" on the USDA boy C6's 6 1/4"
  # 13: "1 1/4 inch for button stand"
  buttonExtension: { pct: 2.4 } # x chest: about 5/8" past CF, the stand's half (1 1/4" stand on a 26" chest)
  buttons: { count: 3 }
  breakAt: { pct: 33, min: 0, max: 100, menu: style } # chest line to waist: 11, 1 1/2" below the chest line (of 4 1/2")
  buttonBottom: { pct: 25, min: 0, max: 60, menu: style } # x waistToSeat: the last button below the waist
  breastPockets: { bool: false } # Diagram 2 draws only the lower pocket
  vent: { bool: false } # no vent drawn
  sleeveVent: { bool: false } # nor a sleeve vent

pieces:
  front:
    prefix: jacket # named like the inherited pieces
    from: bent.front
    hide: tree
    measurements: [seat, waist, waistToSeat, neck]
    options: [frontDrop, hemCurve, buttonExtension, buttons, breastPockets, lowerPockets, pocketFlaps, facingWidth, lapelWidth, gorgeAt, breakAt, buttonBottom, lining, neckFacingWidth, insidePockets]
    let:
      ext: chest * buttonExtension
      q: underarm.x # the front's width at the chest, CF to the old side seam
      # The lapel turns `breakAt` of the way from the chest line to the waist (Simons: 1 1/2" of 4 1/2")
      topButton: underarm.y + (cfWaist.y - underarm.y) * breakAt
    ops:
      # Three buttons from the break to just below the waist; the lapel turns at the top one.
      # Straight flap pockets below the waist, a breast welt at the chest (off)
      - body3Front:
          seamAt: 0.12
          ext: ext
          drop: waistToSeat * frontDrop
          facing: chest * facingWidth
          r: chest * 0.1 * hemCurve
          buttons:
            count: buttons
            buttonholes: true
            top: topButton
            bottom: cfWaist.y + waistToSeat * buttonBottom
          clear: q * 0.08
          welt: 0.18
          welts:
            breast: { x: q * 0.24, y: underarm.y + q * 0.06, len: q * 0.36, rise: q * 0.05, bag: 1.15, mark: breastPockets }
            lower: { x: q * 0.22, y: cfWaist.y + waistToSeat * 0.45, len: q * 0.58, rise: 0, bag: 1.3, mark: lowerPockets, flap: "if(pocketFlaps, 0.32, 0)" }
          lapel:
            breakY: topButton
            rollOut: neck * 0.05
            gorgeAt: gorgeAt
            width: neck * lapelWidth
      # Lined, as the jacket: the facing meets a back-neck facing on the shoulder
      - store: { key: coat.neckFacing, value: { width: neck * neckFacingWidth }, if: lining }

# The pattern map (SPEC.md, "Pattern map"), as the pantry jacket's (which has its own copy); the
# Eton jacket inherits it. construction.yaml gives the sewing order; drape: seams of drape/blouse.yaml.
patternMap:
  pieces:
    { front: 1, back: 2, sideBody: 3, topsleeve: 4, undersleeve: 5, collar: 6, facing: 7, lowerWelt: 10,
      lowerBag: 11, lowerFlap: 12, backNeckFacing: 13, frontLining: 14, backLining: 15, insideWelt: 16, insideBag: 17 }
  stitches:
    SS: { name: straight seam, key: "straight seam, pressed as the step says" }
    HS: { name: hem stitch, key: turn the hem and stitch it }
    BH: { name: buttonhole, key: reinforced machine buttonhole }
  codes:
    A:
      name: shoulder
      stitch: SS
      drape: shoulder
      at: [{ part: front, between: [s3CollarSplit, s3ArmholeSplit] }, { part: back, between: [s3CollarSplit, s3ArmholeSplit] }]
    B:
      name: front body seam
      stitch: SS
      drape: front_seam
      at: [{ part: front, between: [seamStart, seamHem] }, { part: sideBody, between: [frontTop, frontHem] }]
    C:
      name: back body seam
      stitch: SS
      drape: back_seam
      at: [{ part: back, between: [seamStart, seamHem] }, { part: sideBody, between: [backTop, backHem] }]
    D:
      name: armhole and sleeve cap
      stitch: SS
      drape: armhole
      at:
        - { part: front, between: [s3ArmholeSplit, seamStart] }
        - { part: sideBody, point: armBottom }
        - { part: back, between: [seamStart, s3ArmholeSplit] }
        - { part: topsleeve, between: [frontPitchPoint, backPitchPoint] }
        - { part: undersleeve, between: [usLeftEdge, usTip] }
    E:
      name: neckline and collar
      stitch: SS
      at:
        - { part: front, path: frontCollar, along: 0.5 }
        - { part: back, path: backCollar, along: 0.5 }
        - { part: collar, path: neck, along: 0.5 }
        - { part: backNeckFacing, path: backCollar, along: 0.5, optional: true }
    F:
      name: front edge and facing
      stitch: SS
      at: [{ part: front, path: edge, along: 0.5 }, { part: facing, path: edge, along: 0.5 }]
    G:
      name: sleeve front seam
      stitch: SS
      drape: sleeve_front
      at: [{ part: topsleeve, between: [tsLeftEdge, tsWristLeft] }, { part: undersleeve, between: [usLeftEdge, usWristLeft] }]
    H:
      name: sleeve back seam
      stitch: SS
      drape: sleeve_back
      at: [{ part: topsleeve, between: [backPitchPoint, tsWristRight] }, { part: undersleeve, between: [usTip, usWristRight] }]
    J:
      name: body and sleeve hems
      stitch: HS
      at:
        - { part: front, path: hemBase, along: 0.5 }
        - { part: back, between: [cbHem, seamHem] }
        - { part: sideBody, between: [frontHem, backHem] }
        - { part: topsleeve, between: [tsWristLeft, tsWristRight] }
        - { part: undersleeve, between: [usWristLeft, usWristRight] }
    P:
      name: lower pocket mouth and flap
      stitch: SS
      kind: placement
      at: [{ part: front, path: lowerWelt, along: 0.5, optional: true }]
    BH:
      name: buttonhole marks
      stitch: BH
      kind: closure
      at: [{ part: front, snippet: buttonhole0_0, optional: true }]
