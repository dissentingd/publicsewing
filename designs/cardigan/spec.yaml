# A cardigan: Bibi's knit top opened down centre front with a V neck, finished with one band up
# the fronts and round the neck, buttoned, over rib cuffs and a rib hem band. Our own design, with
# no book behind it; see BRIEF.md.
about:
  id: cardigan
  name: Cardigan
  category: tops
  description: A buttoned knit cardigan with a V neck, a front band, long sleeves and rib cuffs and hem, drafted from your measurements
  difficulty: 3
  tags: [tops, knits]
  techniques: [knit, set-in-sleeve, buttonholes, ribbing]
  version: 0.1.0
  source: Built on FreeSewing's Bibi knit block

block: bibi

options:
  sleeveLength: { pct: 100, min: -20, max: 110, menu: style.sleeves } # to the wrist
  # Bibi's rib cuffs and hem band, on by default here
  useCuffRibbing: { bool: true, menu: style }
  useWaistRibbing: { bool: true, menu: style }
  chestEase: { pct: 8, min: 0, max: 25, menu: fit } # worn over a top: Bibi's knit default is 2%
  vNeckDepth: { pct: 55, min: 30, max: 85, of: hpsToWaistFront, menu: style } # the V from the neck point, about 24 cm on a 36 in figure; above the waist at any size
  frontBandWidth: { pct: 7, min: 4, max: 10, of: neck, menu: style } # about 2.7 cm, finished
  collarStretch: { pct: 8, min: 0, max: 20, menu: fit } # the band round the neck only
  buttons: { count: 5, min: 3, max: 8, menu: style }

pieces:
  back:
    from: bibi.back
    hide: tree
    options: [useWaistRibbing, chestEase]
    ops:
      - brand: { nr: 2, title: back }
      - outline: {} # one seam outline from its edges, for exports and the pattern map
  front:
    from: bibi.front
    hide: tree
    options: [useWaistRibbing, chestEase, vNeckDepth]
    measurements: [hpsToWaistFront]
    ops:
      - brand: { nr: 1, title: front }
      - openFront: { depth: hpsToWaistFront * vNeckDepth }
      - outline: {} # one seam outline from its edges, for exports and the pattern map
  sleeve:
    from: bibi.sleeve
    hide: tree
    if: sleeves
    options: [sleeveLength, useCuffRibbing]
    ops:
      - brand: { nr: 3, title: sleeve }
  cuff:
    from: bibi.cuff
    hide: tree
    if: sleeves and useCuffRibbing
    options: [useCuffRibbing]
    ops:
      - brand: { nr: 5, title: cuff }
  hemBand:
    from: bibi.waistband
    hide: tree
    if: useWaistRibbing
    options: [useWaistRibbing]
    ops:
      - brand: { nr: 6, title: hemBand }
  # Bibi's neck binding, drafted (Bibi's back and front read its height) but not cut
  neckBinding:
    from: bibi.neckBinding
    hide: tree
    if: false
  frontBand:
    part: frontBand
    after: [back, front]
    options: [frontBandWidth, collarStretch, buttons, useWaistRibbing]
    measurements: [neck]
    buttons: buttons
    height: neck * frontBandWidth
    stretch: collarStretch
    below: if(useWaistRibbing, block.ribbingHeight, 0)
    nr: 4
    label: frontBand

variants:
  plain:
    name: Plain hem
    description: No rib cuffs or hem band; the sleeves and body hemmed, the front band running to the hem.
    options: { useCuffRibbing: false, useWaistRibbing: false }

# Piece numbers, seam codes and stitches printed on the pattern (SPEC.md "Pattern map")
patternMap:
  pieces: { front: 1, back: 2, sleeve: 3, frontBand: 4, cuff: 5, hemBand: 6 }
  stitches:
    BH: { name: buttonhole, key: machine buttonhole through the interfaced band }
    OS: { name: stretch seam, key: "stretch stitch or overlocker" }
    RB: { name: rib seam, key: "stretch the band to fit between the notches; stretch stitch or overlocker" }
    HS: { name: hem stitch, key: "turn the hem; twin needle or coverstitch" }
  codes:
    A:
      name: shoulder
      stitch: OS
      at: [{ part: front, between: [hps, shoulder] }, { part: back, between: [hps, shoulder] }]
    C:
      name: sleeve cap, set in flat
      stitch: OS
      at:
        - { part: front, path: armhole, along: 0.4 }
        - { part: back, path: armhole, along: 0.4 }
        - { part: sleeve, path: sleevecap, along: 0.5, optional: true }
    S:
      name: side and sleeve seam, in one
      stitch: OS
      at:
        - { part: front, between: [armhole, hem] }
        - { part: back, between: [armhole, hem] }
        - { part: sleeve, between: [bicepsLeft, wristLeft], optional: true }
    H:
      name: hems, or where a cuff or hem band is sewn on
      stitch: HS
      at:
        - { part: front, between: [cfHem, hem], optional: true }
        - { part: back, between: [cbHem, hem], optional: true }
        - { part: sleeve, between: [wristLeft, wristRight], optional: true }
    R:
      name: cuffs and hem band, joined into rings and sewn on
      stitch: RB
      at:
        - { part: cuff, between: [topLeft, bottomLeft], optional: true }
        - { part: hemBand, between: [topLeft, bottomLeft], optional: true }
    B:
      name: front band, up one front, round the neck and down the other
      stitch: RB
      at:
        - { part: frontBand, between: [v2, v3] }
        - { part: front, between: [hps, cfNeck] }
        - { part: front, between: [cfNeck, cfHem] }
        - { part: back, between: [hps, cbNeck] }
    BH:
      name: buttonholes on the band
      stitch: BH
      kind: closure
      at: [{ part: frontBand, snippet: buttonhole0 }]
