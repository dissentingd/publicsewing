# Churidar, inspired by CBSE's Basic Pattern Development (2014); methods and proportions only. Cut flat
# on the bias, each leg one piece on the fold: full at the top, gathered into a belt, close from the
# knee down and longer than the leg, so it falls in folds at the ankle. For any size. See BRIEF.md.
block: titan

about:
  id: churidar
  name: Churidar
  category: trousers
  description: "Close-fitting bias-cut trousers, full at the top and gathered into a belt, extra long so they ruck into folds at the ankle"
  difficulty: 2
  tags: [bottoms]
  techniques: [gathering, casing, hem]
  version: 0.1.0
  source: "Central Board of Secondary Education with the National Institute of Fashion Technology, Basic Pattern Development: Students Handbook + Practical Manual, Class XII (CBSE, 2014)"
  garmentTraditions: [punjab-patternmaking]
  taken: bias-cut leg and proportions
  preview: cisFemaleAdult30

options:
  churidarLength: { pct: 120, min: 100, max: 140, of: waistToFloor, menu: style, title: Churidar length, description: "Length from the waist to the hem, as a share of the waist to the floor: longer than the leg, so it rucks up at the ankle." }
  topWidth: { pct: 33.3, min: 28, max: 45, of: seat, menu: fit, title: Leg top width, description: "Half the width of each leg at the top, as a share of the seat; the tops gather into the belt." }
  crotchShare: { pct: 33.3, min: 25, max: 45, menu: advanced, title: Crotch depth, description: "How far down each leg's top edge the crotch seam runs, as a share of the length below the belt." }
  thighCurve: { pct: 4, min: 0, max: 8, of: seat, menu: advanced, title: Thigh curve, description: "How far the inseam bows out between the crotch and the knee, as a share of the seat." }
  kneeWidth: { pct: 111, min: 100, max: 140, of: knee, menu: fit, title: Knee width, description: "Round the leg at the knee, as a share of the knee." }
  ankleWidth: { pct: 108, min: 100, max: 130, of: heel, menu: fit, title: Ankle width, description: "Round the hem, as a share of the round over the heel, so the foot can pass." }
  beltDepth: { pct: 19.4, min: 10, max: 30, of: seat, menu: style, title: Belt depth, description: "Depth of the belt below its casing, as a share of the seat." }
  casingDepth: { pct: 5.6, min: 3, max: 8, of: seat, menu: style, title: Casing depth, description: "Depth of the drawstring casing folded over at the top of the belt, as a share of the seat." }
  beltWidth: { pct: 56.9, min: 52, max: 70, of: seat, menu: fit, title: Belt width, description: "Half the belt's width (it is cut on the fold), as a share of the seat; the belt must go on over the hips." }

pieces:
  layout:
    from: titan.back
    hide: { self: true, from: true, inherited: true }
    options: all
  leg:
    part: polygon
    after: layout
    nr: 1
    label: leg
    cut: 2
    measurements: [waistToFloor, seat, knee, heel]
    let:
      bc: seat * beltDepth
      len: waistToFloor * churidarLength
      g: len - bc
      w: seat * topWidth
      c: g * crotchShare
      ky: len / 2 - 25.4
      m: knee * kneeWidth / 2
      n: heel * ankleWidth / 2
      b: seat * thighCurve
      dx: m - w
      dy: ky - c
      jl: sqrt(dx * dx + dy * dy)
      ux: dy / jl
      uy: -dx / jl
    points:
      - [0, 0]
      - [w, 0]
      - [w, c]
      - [w + dx * 0.25 + ux * b * 0.71, c + dy * 0.25 + uy * b * 0.71]
      - [w + dx * 0.5 + ux * b, c + dy * 0.5 + uy * b]
      - [w + dx * 0.75 + ux * b * 0.71, c + dy * 0.75 + uy * b * 0.71]
      - [m, ky]
      - [n, g]
      - [0, g]
    allowance: [1, 1, 1, 1, 1, 1, 1, 2, 0]
    fold: 8
    notches: [[w, c], [m, ky]]
    lines: [[[w * 0.1, 15], [w * 0.9, 15]]] # gather the top
    grain: [[w * 0.2, c * 0.8], [w * 0.2 + c * 0.6, c * 0.2]] # on the bias: 45 degrees to the fold
  belt:
    part: polygon
    after: layout
    nr: 2
    label: belt
    cut: 1
    measurements: [seat]
    let:
      w: min(seat * beltWidth, seat * topWidth * 2) # never wider than the legs' tops it gathers
      a: seat * casingDepth
      h: seat * (casingDepth + beltDepth)
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [1, 1, 1, 0]
    fold: 3
    lines: [[[0, a], [w, a]]] # the casing's fold line

# Piece numbers, seam codes and stitches printed on the pattern (SPEC.md "Pattern map"). Leg
# corners: v0 top at the fold, v1 top inner, v2 the crotch notch, v2-v6 the curved inseam to the
# knee, v7 the ankle, v8 the hem at the fold
patternMap:
  pieces: { leg: 1, belt: 2 }
  stitches:
    SS: { name: straight seam, key: "straight seam; finish raw edges" }
    GS: { name: gathering, key: "two rows of long stitches, drawn up to fit" }
    CS: { name: casing, key: turn the casing and stitch it; thread a drawstring or elastic }
    HS: { name: hem stitch, key: turn the hem and stitch it }
  codes:
    I:
      name: inseam, ankle to the crotch notch
      stitch: SS
      at: [{ part: leg, between: [v6, v7] }]
    X:
      name: crotch seam, front and back
      stitch: SS
      at: [{ part: leg, between: [v1, v2] }]
    B:
      name: belt ends
      stitch: SS
      at: [{ part: belt, between: [v1, v2] }]
    W:
      name: legs gathered into the belt
      stitch: GS
      at: [{ part: leg, between: [v0, v1] }, { part: belt, between: [v2, v3] }]
    CS:
      name: casing
      stitch: CS
      kind: placement
      at: [{ part: belt, path: mark0, along: 0.5 }]
    H:
      name: ankle hem
      stitch: HS
      at: [{ part: leg, between: [v7, v8] }]
