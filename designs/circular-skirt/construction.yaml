# References for the independently written steps in BRIEF.md's Construction section.
# Codes and piece numbers are defined once in spec.yaml (patternMap); this file names their sewing order.
design: circular-skirt
steps:
  - { order: 1, action: let hang, pieces: [1, 2] }
  - { order: 2, action: centre back and zip, pieces: [2], seams: [CB], stitches: [SS] }
  - { order: 3, action: side seams, pieces: [1, 2], seams: [S], stitches: [SS] }
  - { order: 4, action: waistband, pieces: [9] }
  - { order: 5, action: level and hem, pieces: [1, 2] }
