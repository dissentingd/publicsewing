# d'Alessio Fig. 30: full cycling breeches gathered into a short buttoned knee band.
extends: ../boys-knickers/spec.yaml

about:
  id: cycling-breeches
  name: Cycling breeches
  category: trousers
  description: Full cycling breeches ending just below the knee, gathered into a buttoned band with a raised back waist
  difficulty: 3
  tags: [bottoms]
  techniques: [gathering, dart, zip, waistband, buttonhole]
  version: 0.1.0
  source: d'Alessio, The Art of Designing Cutting and Grading Gentlemen and Boys Clothes (1906), Fig. 30, PDF pp. 73-74 (artofdesigningcu00ales)
  preview: cisMaleAdult40

options:
  # 21 1/2 in knee circumference including seams at proportion 40: 21.5 / 16.69 in model knee.
  kneeEase: { pct: 29, min: 15, max: 50, menu: fit }
  # The lower leg retains the full knee width before it gathers into the band: 21.5 / 16.69.
  knickerFullness: { pct: 129, min: 105, max: 170, menu: style }
  # 27 in length, knee line 23 in: 4 in below knee, divided by model's 20.55 in knee-to-floor.
  knickerDrop: { pct: 19.5, min: 10, max: 40, menu: style }
  # 30 1/2 in thigh circumference with seams: target 74% of the model's 41.42 in seat.
  cycleThighWidth: { pct: 74, min: 60, max: 100, of: seat, menu: fit }
  # F is 2 in high at the back waist. Titan already raises its centre back about 2 in at size 40.
  # Band 16 by 3 in, divided by model knee 16.69 and waist-to-seat 10.98.
  cycleBandLength: { pct: 96, min: 75, max: 120, of: knee, menu: style }
  cycleBandWidth: { pct: 27.3, min: 15, max: 40, menu: style }
  # The plate puts the extra thigh room near the seat line. 25% down is a smooth Titan adaptation.
  cycleThighAt: { pct: 25, min: 15, max: 50, menu: advanced }

pieces:
  front:
    prefix: trousers
    from: titan.front
    hide: tree
    options: all
    measurements: [waistToSeat]
    let:
      d: (seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
      below: waistToFloor - waistToKnee
      bottom: below * knickerDrop
    ops:
      - trouserLeg:
          which: front
          dart: d * frontDart
          dartAt: 0.55
          dartLength: waistToSeat * frontDartLength
          fly: waist * flyWidth
          flyLength: waistToSeat * 1.05
          pocketTop: if(sidePockets, waistToSeat * 0.18, 0)
          pocketLength: if(sidePockets, waistToSeat * 0.85, 0)
          pocketWidth: seat * 0.08
          pocketDepth: waistToSeat * 0.45
          share: 1 - legBalance
          thighFlare: max(0, (seat * cycleThighWidth - knee * (1 + kneeEase)) / 8)
          thighAt: cycleThighAt
          calfBelow: bottom * 0.6
          calfW: knee * knickerFullness
          cuffBelow: bottom
          cuffW: knee * knickerFullness
          openingBelow: bottom - knee * 0.25
      - markLine: { id: gathers, from: [hemIn.x, hemIn.y - 12], to: [hemOut.x, hemOut.y - 12], class: mark dotted }
  back:
    prefix: trousers
    from: titan.back
    after: front
    hide: tree
    options: all
    measurements: [waistToSeat]
    let:
      d: (seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
      below: waistToFloor - waistToKnee
      bottom: below * knickerDrop
    ops:
      - trouserLeg:
          which: back
          matchOutseam: trousers.front.outseam
          dart: d * backDart
          dartAt: 0.4
          dartFrom: centre
          dartLength: waistToSeat * backDartLength
          pocketTop: if(sidePockets, waistToSeat * 0.18, 0)
          pocketLength: if(sidePockets, waistToSeat * 0.85, 0)
          backPocket: if(backPocket, seat * 0.13, 0)
          backPocketBelow: waistToSeat * 0.4
          backPocketWelt: seat * 0.006
          share: legBalance
          thighFlare: max(0, (seat * cycleThighWidth - knee * (1 + kneeEase)) / 8)
          thighAt: cycleThighAt
          calfBelow: bottom * 0.6
          calfW: knee * knickerFullness
          cuffBelow: bottom
          cuffW: knee * knickerFullness
          openingBelow: bottom - knee * 0.25
      - markLine: { id: gathers, from: [hemIn.x, hemIn.y - 12], to: [hemOut.x, hemOut.y - 12], class: mark dotted }
  strap:
    part: strip
    after: back
    nr: 10
    cut: 2
    fold: true
    length: knee * cycleBandLength + 30
    width: waistToSeat * cycleBandWidth

variants:
  plain:
    name: Plain cycling breeches
    description: The same gathered leg without added thigh flare or pockets.
    options: { cycleThighWidth: 0.65, sidePockets: false, backPocket: false }
