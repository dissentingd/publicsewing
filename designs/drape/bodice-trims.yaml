# TRIAL (2026-11-17): bodice.yaml plus the collar and the cuffs, cut and placed from the
# drafting's own points. Drape a bodice-and-skirt yoke garment (the frock, the shirtwaist dress:
# the bodice runs to the waist, the skirt gathered into it) on GarmentCode's female average body,
# with set-in sleeves. Placement as jacket.yaml / coat-shell.yaml (cm, y up, the body facing +z,
# its right side at -x; right-hand copies). Each body sits in its yoke's frame: x from its own
# fold, y from the yoke's neck point. Yokes are exported cut at CF/CB (--clip <yoke>=0), so an
# opening yoke and a yoke on the fold both end at clipTop/clipBottom; the body's gathered top
# sews to the yoke's shorter seam (the simulator draws it in). Plackets and pockets are left off.
# Trims (runs.yaml: split collar=shoulderNeck; clip cuff=lapEnd, clipY cuff=lapEndFold, split
# cuff=underarm/overarm): the collar in back and front parts at the shoulder, hanging turned
# down from the neckline; each cuff to its fold, its lap off, in three parts (lap end to the
# underarm, under to over the arm, over the arm to its end), sewn to the sleeve's hem and
# closed at the opening. Trims are placed from the piece they sew to (`follow`,
# tools/drape_spec.py); `offset` and `clear` only space them for the simulation's start.
body: f_smpl_average_A40
pieces:
  backBodice: {origin: [backBodice.clipTop, backBodice.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -15]}
  backSkirt: {origin: [backSkirt.topFold, backBodice.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -17]}
  frontBodice: {origin: [frontBodice.clipTop, frontBodice.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 141, 19]}
  frontSkirt: {origin: [frontSkirt.topFold, frontBodice.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 141, 21]}
  sleevePlus: {origin: sleevePlus.clipTop, map: [[0, 1], [1, 0]], ccw: true, rotation: [0, 0, 221], translation: [-21, 137, 10]}
  sleeveMinus: {origin: sleeveMinus.clipTop, map: [[0, 1], [-1, 0]], ccw: false, rotation: [0, 0, 221], translation: [-21, 137, -12]}
  # Turned down, so facing in (ccw opposite to the bodice), as the neckline seam folds it
  collarMinus: {map: [[-1, 0], [0, -1]], ccw: true, follow: {piece: backBodice, at: [collarMinus.cbNeck, backBodice.clipTop], clear: 2}}
  collarPlus: {map: [[1, 0], [0, -1]], ccw: false, follow: {piece: frontBodice, at: [collarPlus.frontNeck, frontBodice.clipTop], clear: 2}}
  # Each cuff part beyond the stretch of hem it sews to, its sewn edge along the hem
  cuff2: {map: [[0, 1], [-1, 0]], ccw: true, follow: {piece: sleevePlus, at: [cuff2.overarm, sleevePlus.clipBottom], offset: [1.5, 0]}}
  cuff3: {map: [[0, 1], [1, 0]], ccw: false, follow: {piece: sleeveMinus, at: [cuff3.overarm, sleeveMinus.clipBottom], offset: [1.5, 0]}}
  cuff1: {map: [[0, 1], [1, 0]], ccw: false, follow: {piece: sleeveMinus, at: [cuff1.underarm, sleeveMinus.wristLeft], offset: [1.5, 0]}}
seams:
  centre_back_bodice: {a: [{piece: backBodice, along: [backBodice.clipTop, backBodice.clipBottom]}], mirror: true}
  centre_back: {a: [{piece: backSkirt, along: [backSkirt.topFold, backSkirt.hemFold]}], mirror: true}
  centre_front_bodice: {a: [{piece: frontBodice, along: [frontBodice.clipTop, frontBodice.clipBottom]}], mirror: true}
  centre_front: {a: [{piece: frontSkirt, along: [frontSkirt.topFold, frontSkirt.hemFold]}], mirror: true}
  shoulder:
    a: [{piece: backBodice, along: [backBodice.hps, backBodice.shoulder]}]
    b: [{piece: frontBodice, along: [frontBodice.hps, frontBodice.shoulder]}]
  back_waist:
    a: [{piece: backBodice, along: [backBodice.clipBottom, backBodice.seamArm]}]
    b: [{piece: backSkirt, along: [backSkirt.topFold, backSkirt.yokeSide]}]
  front_waist:
    a: [{piece: frontBodice, along: [frontBodice.clipBottom, frontBodice.seamArm]}]
    b: [{piece: frontSkirt, along: [frontSkirt.topFold, frontSkirt.yokeSide]}]
  side_bodice:
    a: [{piece: backBodice, along: [backBodice.underarm, backBodice.seamArm]}]
    b: [{piece: frontBodice, along: [frontBodice.underarm, frontBodice.seamArm]}]
  side:
    a: [{piece: backSkirt, along: [backSkirt.sideTop, backSkirt.hemSide]}]
    b: [{piece: frontSkirt, along: [frontSkirt.sideTop, frontSkirt.hemSide]}]
  armhole:
    a: [{piece: backBodice, along: [backBodice.underarm, backBodice.shoulder]}, {piece: frontBodice, along: [frontBodice.shoulder, frontBodice.underarm]}]
    b: [{piece: sleeveMinus, along: [sleeveMinus.bicepsLeft, sleeveMinus.capQ4, sleeveMinus.capQ3, sleeveMinus.clipTop]},
        {piece: sleevePlus, along: [sleevePlus.clipTop, sleevePlus.capQ2, sleevePlus.capQ1, sleevePlus.bicepsRight]}]
    anchors: [[backBodice.shoulder, sleeveMinus.clipTop]]
  overarm:
    a: [{piece: sleevePlus, along: [sleevePlus.clipTop, sleevePlus.clipBottom]}]
    b: [{piece: sleeveMinus, along: [sleeveMinus.clipTop, sleeveMinus.clipBottom]}]
  underarm:
    a: [{piece: sleevePlus, along: [sleevePlus.bicepsRight, sleevePlus.wristRight]}]
    b: [{piece: sleeveMinus, along: [sleeveMinus.bicepsLeft, sleeveMinus.wristLeft]}]
  collar_cb: {a: [{piece: collarMinus, along: [collarMinus.cbNeck, collarMinus.cbOuter]}], mirror: true}
  collar_shoulder:
    a: [{piece: collarMinus, along: [collarMinus.clipTop, collarMinus.clipBottom]}]
    b: [{piece: collarPlus, along: [collarPlus.clipTop, collarPlus.clipBottom]}]
  neck_back:
    a: [{piece: collarMinus, along: [collarMinus.cbNeck, collarMinus.clipTop]}]
    b: [{piece: backBodice, along: [backBodice.clipTop, backBodice.hps]}]
  neck_front:
    a: [{piece: collarPlus, along: [collarPlus.clipTop, collarPlus.frontNeck]}]
    b: [{piece: frontBodice, along: [frontBodice.hps, frontBodice.clipTop]}]
  # The hem: the front half from over the arm to the underarm, the back half from over the arm
  # past the opening to the underarm
  cuff_front:
    a: [{piece: sleevePlus, along: [sleevePlus.clipBottom, sleevePlus.wristRight]}]
    b: [{piece: cuff2, along: [cuff2.overarm, cuff2.underarm]}]
  cuff_back:
    a: [{piece: sleeveMinus, along: [sleeveMinus.clipBottom, sleeveMinus.wristLeft]}]
    b: [{piece: cuff3, along: [cuff3.overarm, cuff3.bandEnd]}, {piece: cuff1, along: [cuff1.lapEnd, cuff1.underarm]}]
  cuff_under:
    a: [{piece: cuff1, along: [cuff1.underarm, cuff1.underarmFold]}]
    b: [{piece: cuff2, along: [cuff2.underarm, cuff2.underarmFold]}]
  cuff_over:
    a: [{piece: cuff2, along: [cuff2.overarm, cuff2.overarmFold]}]
    b: [{piece: cuff3, along: [cuff3.overarm, cuff3.overarmFold]}]
  # Buttoned: the lap's end under the band's end
  cuff_closed:
    a: [{piece: cuff1, along: [cuff1.lapEnd, cuff1.lapEndFold]}]
    b: [{piece: cuff3, along: [cuff3.bandEnd, cuff3.bandEndFold]}]
