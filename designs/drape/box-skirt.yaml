# Box coat with separate dropped skirt pieces and the front hip dart.
# Collar, facing and pocket trim stay off the cloth simulation.
body: f_smpl_average_A40
pieces:
  back: {origin: [back.cbNeck, back.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -15]}
  backSkirt: {origin: [backSkirt.topEdge, back.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -17]}
  front: {origin: [front.clipBottom, front.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 141, 20]}
  frontSkirt: {origin: [frontSkirt.clipTop, front.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 141, 21]}
  topsleeve: {origin: topsleeve.top, map: [[0, 1], [-1, 0]], ccw: true, rotation: [0, 0, 221], translation: [-21, 137, 10]}
  undersleeve: {origin: topsleeve.top, map: [[0, 1], [-1, 0]], ccw: false, rotation: [0, 0, 221], translation: [-21, 137, -12]}
seams:
  centre_back_body: {a: [{piece: back, along: [back.cbNeck, back.skirtEdge]}], mirror: true}
  centre_back_skirt: {a: [{piece: backSkirt, along: [backSkirt.topEdge, backSkirt.hemEdge]}], mirror: true}
  centre_front_body: {a: [{piece: front, along: [front.clipTop, front.clipBottom]}], mirror: true}
  centre_front_skirt: {a: [{piece: frontSkirt, along: [frontSkirt.clipTop, frontSkirt.clipBottom]}], mirror: true}
  neck_dart:
    a: [{piece: front, along: [front.dartSide, front.dartTip]}]
    b: [{piece: front, along: [front.gorge, front.dartTip]}]
  hip_dart:
    a: [{piece: frontSkirt, along: [frontSkirt.dartLeft, frontSkirt.dartTip]}]
    b: [{piece: frontSkirt, along: [frontSkirt.dartRight, frontSkirt.dartTip]}]
  shoulder:
    a: [{piece: back, along: [back.hps, back.shoulder]}]
    b: [{piece: front, along: [front.hps, front.shoulder]}]
  body_side:
    a: [{piece: back, along: [back.armhole, back.skirtSide]}]
    b: [{piece: front, along: [front.armhole, front.skirtSide]}]
  skirt_side:
    a: [{piece: backSkirt, along: [backSkirt.topSide, backSkirt.hemSide]}]
    b: [{piece: frontSkirt, along: [frontSkirt.topSide, frontSkirt.hemSide]}]
  back_join:
    a: [{piece: back, along: [back.skirtEdge, back.skirtSide]}]
    b: [{piece: backSkirt, along: [backSkirt.topEdge, backSkirt.topSide]}]
  front_join:
    a: [{piece: front, along: [front.clipBottom, front.skirtSide]}]
    b: [{piece: frontSkirt, along: [frontSkirt.clipTop, frontSkirt.dartLeft]},
        {piece: frontSkirt, along: [frontSkirt.dartRight, frontSkirt.topSide]}]
  armhole:
    a: [{piece: front, along: [front.shoulder, front.armhole]},
        {piece: back, along: [back.armhole, back.shoulder]}]
    b: [{piece: topsleeve, along: [topsleeve.top, topsleeve.frontPitchPoint, topsleeve.tsLeftEdge]},
        {piece: undersleeve, along: [undersleeve.usLeftEdge, undersleeve.usTip]},
        {piece: topsleeve, along: [topsleeve.backPitchPoint, topsleeve.top]}]
  sleeve_front:
    a: [{piece: topsleeve, along: [topsleeve.tsLeftEdge, topsleeve.tsElbowLeft, topsleeve.tsWristLeft]}]
    b: [{piece: undersleeve, along: [undersleeve.usLeftEdge, undersleeve.usElbowLeft, undersleeve.usWristLeft]}]
  sleeve_back:
    a: [{piece: topsleeve, along: [topsleeve.backPitchPoint, topsleeve.elbowRight, topsleeve.tsWristRight]}]
    b: [{piece: undersleeve, along: [undersleeve.usTip, undersleeve.elbowRight, undersleeve.usWristRight]}]
