# Drape a box body (lib/jacket.mjs, draftBoxLayout) on GarmentCode's female average body: back
# (on the fold), front (cut at CF so the two sew closed edge to edge; the neck dart sewn), and
# the two-piece sleeve. Collar and facings are left off. Export:
#   node tools/drape-export.mjs box-coat cisFemaleAdult34 out.json \
#     --pieces back,front,topsleeve,undersleeve --clip front=cfLine --m chest=900,waist=800,seat=1070
# Placement as jacket.yaml (cm, y up, the body facing +z, its right side at -x; right-hand
# copies; neck point ~141 up). The sleeves start further from the arm than the jacket's (z
# 10 and -12): this coat's bigger sleeve, started at 7 and -9, began inside the upper arm.
body: f_smpl_average_A40
pieces:
  back: {origin: [back.cbNeck, back.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -15]}
  front: {origin: [front.clipBottom, front.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 141, 20]}
  topsleeve: {origin: topsleeve.top, map: [[0, 1], [-1, 0]], ccw: true, rotation: [0, 0, 221], translation: [-21, 137, 10]}
  undersleeve: {origin: topsleeve.top, map: [[0, 1], [-1, 0]], ccw: false, rotation: [0, 0, 221], translation: [-21, 137, -12]}
seams:
  centre_back: {a: [{piece: back, along: [back.cbNeck, back.cbHem]}], mirror: true}
  centre_front: {a: [{piece: front, along: [front.clipTop, front.clipBottom]}], mirror: true}
  neck_dart:
    a: [{piece: front, along: [front.dartSide, front.dartTip]}]
    b: [{piece: front, along: [front.gorge, front.dartTip]}]
  shoulder:
    a: [{piece: back, along: [back.hps, back.shoulder]}]
    b: [{piece: front, along: [front.hps, front.shoulder]}]
  side:
    a: [{piece: back, along: [back.armhole, back.hemSide]}]
    b: [{piece: front, along: [front.armhole, front.hemSide]}]
  armhole:
    a: [{piece: front, along: [front.shoulder, front.armhole]},
        {piece: back, along: [back.armhole, back.shoulder]}]
    b: [{piece: topsleeve, along: [topsleeve.top, topsleeve.frontPitchPoint, topsleeve.tsLeftEdge]},
        {piece: undersleeve, along: [undersleeve.usLeftEdge, undersleeve.usTip]},
        {piece: topsleeve, along: [topsleeve.backPitchPoint, topsleeve.top]}]
  sleeve_front:
    a: [{piece: topsleeve, along: [topsleeve.tsLeftEdge, topsleeve.tsElbowLeft, topsleeve.tsWristLeft]}]
    b: [{piece: undersleeve, along: [undersleeve.usLeftEdge, undersleeve.usElbowLeft, undersleeve.usWristLeft]}]
  sleeve_back:
    a: [{piece: topsleeve, along: [topsleeve.backPitchPoint, topsleeve.elbowRight, topsleeve.tsWristRight]}]
    b: [{piece: undersleeve, along: [undersleeve.usTip, undersleeve.elbowRight, undersleeve.usWristRight]}]
