# Drape a two-piece cape (lib/cape.mjs: the cape and the cape overcoat) on GarmentCode's male
# average body: the back on the fold at CB, the fronts cut at CF so the two sew closed, sewn over
# the shoulder and down the side seam. The collar and facings are left off. Export:
#   node tools/drape-export.mjs cape cisMaleAdult38 out.json --pieces back,front --clip front=cfNeck
#
# Placement: cm, y up, the body facing +z, its right side at -x; right-hand copies. The back is
# drafted lying on its side, its CB fold along the top, so its map turns it upright.
body: m_smpl_average_A40
pieces:
  back: {origin: back.cbNeck, map: [[0, -1], [-1, 0]], ccw: false, translation: [0, 152, -19]}
  front: {origin: [front.cfNeck, front.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 153, 23]}
seams:
  centre_back: {a: [{piece: back, along: [back.cbNeck, back.cbHem]}], mirror: true}
  centre_front: {a: [{piece: front, along: [front.clipTop, front.clipBottom]}], mirror: true}
  shoulder:
    a: [{piece: back, along: [back.hps, back.tip]}]
    b: [{piece: front, along: [front.hps, front.tip]}]
  side:
    a: [{piece: back, along: [back.tip, back.sideHem]}]
    b: [{piece: front, along: [front.tip, front.sideHem]}]
