# Drape culottes (lib/skirt.mjs `culotte`) on GarmentCode's female average body: front and back
# legs, placed as tailored trousers (trousers-tailored.yaml), each inseam hanging straight between
# the legs. The waistband is left off: the waist is labelled `lower_interface` and pinned
# (holdWaist). c0, c1, ... are the seam's vertices in drawing order. Front: c0 side waist, c1 CF
# waist, c2 crotch start, c3 fork, c4 inseam hem, c5 side hem, c6 side at the seat. Back: c0 side
# waist, c1 side at the seat, c2 side hem, c3 inseam hem, c4 fork, c5 crotch start, c6 CB waist.
body: f_smpl_average_A40
pieces:
  frontPanel: {origin: [frontPanel.fork, frontPanel.c1], map: [[1, 0], [0, -1]], ccw: true, translation: [0, 102, 22], hang: {from: frontPanel.fork, to: frontPanel.inseamHem, x: -0.7}}
  gore1: {origin: [gore1.fork, gore1.c6], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 102, -22], hang: {from: gore1.fork, to: gore1.inseamHem, x: -0.7}}
seams:
  centre_front: {a: [{piece: frontPanel, along: [frontPanel.c1, frontPanel.c2, frontPanel.fork]}], mirror: true}
  centre_back: {a: [{piece: gore1, along: [gore1.c6, gore1.c5, gore1.fork]}], mirror: true}
  side:
    a: [{piece: frontPanel, along: [frontPanel.c0, frontPanel.c6, frontPanel.c5]}]
    b: [{piece: gore1, along: [gore1.c0, gore1.c1, gore1.c2]}]
  inseam:
    a: [{piece: frontPanel, along: [frontPanel.fork, frontPanel.inseamHem]}]
    b: [{piece: gore1, along: [gore1.fork, gore1.inseamHem]}]
labels:
  lower_interface: [{piece: frontPanel, along: [frontPanel.c0, frontPanel.c1]}, {piece: gore1, along: [gore1.c0, gore1.c6]}]
