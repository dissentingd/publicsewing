# Drape the riding frock coat on GarmentCode's female average body: the fitted body cut through at the waist and
# a one-piece skirt from the front edge round to the back seam. The fronts hang open, so nothing
# is sewn at CF. Collar, facings, pleats and lining are left off. c-numbers are the back's seam
# vertices in drawing order. The skirt starts at the body's side, facing out.
body: f_smpl_average_A40
pieces:
  back: {origin: [back.cbNeck, back.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -15]}
  sideBack: {origin: [back.cbNeck, back.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 141, -17]}
  front: {origin: front.hps, map: [[-1, 0], [0, -1]], ccw: true, translation: [-7, 137, 20]}
  sideFront: {origin: front.hps, map: [[-1, 0], [0, -1]], ccw: true, translation: [-7, 137, 22]}
  underArm: {origin: underArm.armhole, map: [[1, 0], [0, -1]], ccw: true, rotation: [0, -90, 0], translation: [-22, 118, 0]}
  skirt: {origin: skirt.seam2Waist, map: [[-1, 0], [0, -1]], ccw: true, rotation: [0, -90, 0], translation: [-25, 101, 0]}
  topsleeve: {origin: topsleeve.top, map: [[0, 1], [-1, 0]], ccw: true, rotation: [0, 0, 221], translation: [-21, 137, 7]}
  undersleeve: {origin: topsleeve.top, map: [[0, 1], [-1, 0]], ccw: false, rotation: [0, 0, 221], translation: [-21, 137, -9]}
seams:
  centre_back: {a: [{piece: back, along: [back.cbNeck, back.cbHem]}], mirror: true}
  back_seam:
    a: [{piece: back, along: [back.seamTop, back.seamBust, back.seamWaist]}]
    b: [{piece: sideBack, along: [sideBack.seamTop, sideBack.seamBust, sideBack.seamWaist]}]
  front_seam:
    a: [{piece: front, along: [front.seamTop, front.seamBust, front.seamWaist]}]
    b: [{piece: sideFront, along: [sideFront.seamTop, sideFront.seamBust, sideFront.seamWaist]}]
  under_back:
    a: [{piece: sideBack, along: [sideBack.armhole, sideBack.waist]}]
    b: [{piece: underArm, along: [underArm.backTop, underArm.backWaist]}]
  under_front:
    a: [{piece: underArm, along: [underArm.frontTop, underArm.frontWaist]}]
    b: [{piece: sideFront, along: [sideFront.armhole, sideFront.waist]}]
  shoulder:
    a: [{piece: back, along: [back.hps, back.c8]}]
    b: [{piece: front, along: [front.hps, front.seamTop]}, {piece: sideFront, along: [sideFront.seamTop, sideFront.shoulder]}]
  waist:
    a: [{piece: front, along: [front.waistEdge, front.seamWaist]}, {piece: sideFront, along: [sideFront.seamWaist, sideFront.waist]},
        {piece: underArm, along: [underArm.frontWaist, underArm.backWaist]}, {piece: sideBack, along: [sideBack.waist, sideBack.seamWaist]}]
    b: [{piece: skirt, along: [skirt.waistEdge, skirt.seam1Waist, skirt.seam2Waist, skirt.seam3Waist, skirt.backSeamWaist]}]
  back_skirt:
    a: [{piece: back, along: [back.seamWaist, back.hemSeam]}]
    b: [{piece: skirt, along: [skirt.backSeamWaist, skirt.backSeamHem]}]
  armhole:
    a: [{piece: sideFront, along: [sideFront.shoulder, sideFront.armhole]},
        {piece: underArm, along: [underArm.frontTop, underArm.armhole, underArm.backTop]},
        {piece: sideBack, along: [sideBack.armhole, sideBack.seamTop]},
        {piece: back, along: [back.seamTop, back.c8]}]
    b: [{piece: topsleeve, along: [topsleeve.top, topsleeve.frontPitchPoint, topsleeve.tsLeftEdge]},
        {piece: undersleeve, along: [undersleeve.usLeftEdge, undersleeve.usTip]},
        {piece: topsleeve, along: [topsleeve.backPitchPoint, topsleeve.top]}]
  sleeve_front:
    a: [{piece: topsleeve, along: [topsleeve.tsLeftEdge, topsleeve.tsElbowLeft, topsleeve.tsWristLeft]}]
    b: [{piece: undersleeve, along: [undersleeve.usLeftEdge, undersleeve.usElbowLeft, undersleeve.usWristLeft]}]
  sleeve_back:
    a: [{piece: topsleeve, along: [topsleeve.backPitchPoint, topsleeve.elbowRight, topsleeve.tsWristRight]}]
    b: [{piece: undersleeve, along: [undersleeve.usTip, undersleeve.elbowRight, undersleeve.usWristRight]}]
