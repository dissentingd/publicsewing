# Drape a yoke garment with a back yoke and a one-piece front (the nightshirt) on GarmentCode's
# male average body; the front is exported cut at CF (--clip frontBody=0).
# Placement as jacket.yaml / coat-shell.yaml (cm, y up, the body facing +z, its right side at
# -x; right-hand copies). Each body sits in its yoke's frame: x from its own fold, y from the
# yoke's neck point. Yokes are exported cut at CF/CB (--clip <yoke>=0), so an opening yoke and a
# yoke on the fold both end at clipTop/clipBottom; the body's gathered top sews to the yoke's
# shorter seam (the simulator draws it in). Bands, plackets, collars and pockets are left off.
body: m_smpl_average_A40
pieces:
  backYoke: {origin: [backYoke.clipTop, backYoke.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 153, -17]}
  backBody: {origin: [backBody.topFold, backYoke.hps], map: [[-1, 0], [0, -1]], ccw: false, translation: [0, 153, -19]}
  frontBody: {origin: [frontBody.clipTop, frontBody.hps], map: [[-1, 0], [0, -1]], ccw: true, translation: [0, 153, 21]}
  sleevePlus: {origin: sleevePlus.clipTop, map: [[0, 1], [1, 0]], ccw: true, rotation: [0, 0, 221], translation: [-21, 148, 10]}
  sleeveMinus: {origin: sleeveMinus.clipTop, map: [[0, 1], [-1, 0]], ccw: false, rotation: [0, 0, 221], translation: [-21, 148, -12]}
seams:
  centre_back_yoke: {a: [{piece: backYoke, along: [backYoke.clipTop, backYoke.clipBottom]}], mirror: true}
  centre_back: {a: [{piece: backBody, along: [backBody.topFold, backBody.hemFold]}], mirror: true}
  centre_front: {a: [{piece: frontBody, along: [frontBody.clipTop, frontBody.clipBottom]}], mirror: true}
  shoulder:
    a: [{piece: backYoke, along: [backYoke.hps, backYoke.shoulder]}]
    b: [{piece: frontBody, along: [frontBody.hps, frontBody.shoulder]}]
  back_yoke:
    a: [{piece: backYoke, along: [backYoke.clipBottom, backYoke.seamArm]}]
    b: [{piece: backBody, along: [backBody.topFold, backBody.yokeSide]}]
  side:
    a: [{piece: backBody, along: [backBody.sideTop, backBody.hemSide]}]
    b: [{piece: frontBody, along: [frontBody.sideTop, frontBody.hemSide]}]
  armhole:
    a: [{piece: backBody, along: [backBody.sideTop, backBody.yokeSide]}, {piece: backYoke, along: [backYoke.seamArm, backYoke.shoulder]},
        {piece: frontBody, along: [frontBody.shoulder, frontBody.sideTop]}]
    b: [{piece: sleeveMinus, along: [sleeveMinus.bicepsLeft, sleeveMinus.capQ4, sleeveMinus.capQ3, sleeveMinus.clipTop]},
        {piece: sleevePlus, along: [sleevePlus.clipTop, sleevePlus.capQ2, sleevePlus.capQ1, sleevePlus.bicepsRight]}]
    anchors: [[backYoke.shoulder, sleeveMinus.clipTop]]
  overarm:
    a: [{piece: sleevePlus, along: [sleevePlus.clipTop, sleevePlus.clipBottom]}]
    b: [{piece: sleeveMinus, along: [sleeveMinus.clipTop, sleeveMinus.clipBottom]}]
  underarm:
    a: [{piece: sleevePlus, along: [sleevePlus.bicepsRight, sleevePlus.wristRight]}]
    b: [{piece: sleeveMinus, along: [sleeveMinus.bicepsLeft, sleeveMinus.wristLeft]}]
