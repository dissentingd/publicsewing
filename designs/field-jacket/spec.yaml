# Field jacket: Merz's hunting jacket (Merz's Practical Cutting System for Ladies' Jackets and
# Cloaks, 1911, Diagram XX, "Hunting Jacket--Turn Collar, Fly Front", pp. 50-51), on the box coat
# (FreeSewing's Breanna): a straight, hip-length jacket cut for women, buttoned on CF from a small
# lapel turning at the bust line, a turn collar, four flapped patch pockets, two-piece sleeves.
# See BRIEF.md.
extends: ../box-coat/spec.yaml

about:
  id: fieldjacket
  name: Field jacket
  description: "A straight, hip-length jacket cut for women: small lapels, buttoned down the front, four flapped patch pockets"
  difficulty: 3
  tags: [jackets]
  techniques: [dart, lapel, collar, facing, button, patch-pocket, two-piece-sleeve]
  version: 0.1.0
  source: "Merz, Practical Cutting System for Ladies' Jackets and Cloaks (1911), Diagram XX, pp. 50-51 (merzspracticalcu00merz)"
  preview: cisFemaleAdult36 # the size of the pattern-pieces preview on its page (tools/preview.mjs)

options:
  # Style: hip length, a little flare
  lengthBelowWaist: { pct: 28, min: 20 } # x waistToFloor: about 11" below the waist
  flare: { pct: 2 } # x seat, each side of the side seam
  # "For a fly-front jacket, the overlap ... is 1 3/4 inches": buttons on CF
  buttonExtension: { pct: 4.9 } # x chest: 1 3/4" on a 36 bust
  buttonInset: { pct: 100 } # on CF
  buttons: { count: 5 }
  # Turn collar and lapels: the crease from D, at the bust line
  breakBelowBust: { pct: 0 }
  lapelStyle: { dflt: notch }
  lapelWidth: { pct: 20 } # x neck: small lapels
  collarWidth: { pct: 20 } # x neck: the turn collar, 1 3/4" stand and fall
  # Set-in pockets off; patch pockets instead
  pockets: { bool: false }
  ticketPocket: { bool: false }
  breastPockets: { bool: true, menu: style }
  lowerPockets: { bool: true, menu: style }
  pocketFlaps: { bool: true, menu: style }
  pocketShape: { dflt: square, list: [square, rounded, pointed, chamfered], menu: style }
  patchFromCF: { pct: 3.5, min: 1, max: 8, of: chest, menu: style } # each pocket's front edge behind CF
  breastPocketAbove: { pct: 36, min: 20, max: 60, menu: style } # x hpsToWaistFront: the top above the waist, below the lapel
  breastPocketWidth: { pct: 13, min: 8, max: 18, of: chest, menu: style }
  lowerPocketBelow: { pct: 15, min: 0, max: 50, menu: style } # x waistToSeat: the top below the waist
  lowerPocketWidth: { pct: 17, min: 10, max: 22, of: chest, menu: style }
  patchDepth: { pct: 115, min: 80, max: 140, menu: style } # x each pocket's width
  flapRatio: { pct: 38, min: 25, max: 55, menu: style } # x each pocket's width

pieces:
  frontBase:
    prefix: boxcoat # named like the inherited pieces
    from: breanna.front
    after: [backBase]
    hide: { self: true, from: true, inherited: true }
    options: all
    measurements: [chest, seat, waistToSeat, waistToFloor, neck, hpsToWaistFront]
    ops:
      - jacketBase: { side: front, style: box }
      - boxLayout:
          seat: seat * (1 + seatEase)
          hipDepth: waistToSeat
          length: waistToFloor * lengthBelowWaist
          flare: seat * flare
          cbOut: seat * cbFlare
          lap: chest * buttonExtension
          buttonInset: buttonInset
          pockets:
            hip:
              if: pockets
              below: waistToSeat * pocketBelow
              from: chest * pocketFromCF
              w: chest * pocketWidth
              flap: w * flapDepth
              bag: w * bagDepth
              clear: chest * 0.02
            ticket:
              if: pockets and ticketPocket
              below: waistToSeat * (pocketBelow - ticketAbove)
              from: chest * pocketFromCF
              w: chest * pocketWidth * ticketWidth
              flap: w * ticketFlapDepth
              bag: w * bagDepth
              clear: chest * 0.02
          # Patch pockets with flaps: a pair on the chest, a pair below the waist
          patch:
            breast:
              if: breastPockets
              x: chest * patchFromCF
              y: -hpsToWaistFront * breastPocketAbove
              w: chest * breastPocketWidth
              h: w * patchDepth
              shape: pocketShape
              topHem: w * 0.15
              clear: chest * 0.02
              flap: { if: pocketFlaps, h: w * flapRatio, gap: w * 0.06 }
            lower:
              if: lowerPockets
              x: chest * patchFromCF
              y: waistToSeat * lowerPocketBelow
              w: chest * lowerPocketWidth
              h: w * patchDepth
              shape: pocketShape
              topHem: w * 0.15
              clear: chest * 0.02
              flap: { if: pocketFlaps, h: w * flapRatio, gap: w * 0.06 }
          breakBelow: hpsToWaistFront * breakBelowBust
          rollOut: neck * rollOut
          lapelWidth: neck * lapelWidth
          peak: lapelStyle == 'peak'
          facing: chest * facingWidth
          dartWidth: chest * neckDartWidth
          dartAt: neckDartAt
          dartLength: neckDartLength
          sleeveStore: [library.twoPartSleeve, library.topsleeve, library.undersleeve, boxcoat.topsleeve, boxcoat.undersleeve]
      - store: { key: library.topsleeve.title, value: { nr: 5, brand: "'PublicSewing'" } }
      - store: { key: library.undersleeve.title, value: { nr: 6, brand: "'PublicSewing'" } }


  # Patch pockets and flaps
  breastPocket: { part: pocket, after: [backBase, frontBase], key: breast, nr: 13, label: breastPocket, cut: 2, if: breastPockets }
  breastFlap: { part: flap, after: [backBase, frontBase], key: breast, nr: 14, label: breastFlap, cut: 2, if: breastPockets and pocketFlaps }
  lowerPocket: { part: pocket, after: [backBase, frontBase], key: lower, nr: 15, label: lowerPocket, cut: 2, if: lowerPockets }
  lowerFlap: { part: flap, after: [backBase, frontBase], key: lower, nr: 16, label: lowerFlap, cut: 2, if: lowerPockets and pocketFlaps }
