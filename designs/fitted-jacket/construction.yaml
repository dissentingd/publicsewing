# Sewing order for the independently written numbered steps in BRIEF.md.
# Codes are defined in spec.yaml's patternMap.
design: fitted-jacket
steps:
  - { order: 1, action: join princess centre back and under-arm panel seams, seams: [PF, PB, CB, SF, SB], stitches: [SS] }
  - { order: 2, action: make hip pockets, placements: [P14], stitches: [SS], whenAny: [pockets] }
  - { order: 3, action: make breast welt pocket, placements: [P12], stitches: [SS], whenAny: [breastPocket] }
  - { order: 4, action: make ticket welt pocket, placements: [P17], stitches: [SS], whenAny: [ticketPocket] }
  - { order: 5, action: join shoulders and attach shawl collar and facings, seams: [A, D, E], stitches: [SS] }
  - { order: 6, action: join and set sleeves, seams: [F, G, C], stitches: [SS] }
  - { order: 7, action: make and attach lining }
  - { order: 8, action: finish hems and front fastening, seams: [H], placements: [BH], stitches: [HS, BH] }
