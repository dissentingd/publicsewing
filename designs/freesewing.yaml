# FreeSewing's own designs, listed on publicsewing.org as theirs (decided 2026-11-09).
# They're npm dependencies at the pinned FreeSewing version (package.json here and in site/),
# never copied or re-specced: no spec.yaml, no BRIEF.md, no muslin status. Each gets a page under
# Inspired Designs, crediting and linking FreeSewing, and keeps FreeSewing's title on the printed
# pattern. FreeSewing's code is MIT (site/patches/LICENSE-freesewing).
#
# Each entry, keyed by the design's id (its page is /designs/<id>):
#   package, export: what to import from npm
#   name: the garment, in our words; category: one of lib/categories.mjs
#   about: one sentence, in our own words
#   ours: our designs of the same garment, linked both ways (BUILD_QUEUE.md F11)
#   needs: packages it imports without declaring them, installed alongside (record new ones here)
#   sizes: which size sets it's tested at and offered: (none) our 98; `babies` the baby and toddler
#     sets (sizes/babies.mjs) only; `all` both
#   skip: size sets it can't draft at (a FreeSewing bug, recorded here), left out of the tests and
#     the size picker
# test/freesewing-designs.test.mjs drafts each at every size set. Their type in the garment
# family tree is garments/tree.yaml (`freesewing:`).
upstream: https://freesewing.eu/designs/

