# Garment elements: the traits garments are built from, and what in lib/ builds each.
# See garments/README.md. A garment type in tree.yaml lists the elements it needs; a type whose
# elements are all `covered` can be built from the library without new code.
#
# Each element:
#   name, group (see `groups`), status: covered | partial | gap
#   lib: the operations or piece types that build it (lib/spec.mjs), as `name` or `name.argument`
#   seen: designs that use it, for its reference proportions (sourced numbers to reuse)
#   note: what's partial or missing
#   freesewing: FreeSewing designs or blocks that have it: adopting one as a block (designs/blocks/)
#     or extending it would cover the element. Listing their design alone does not.
# Vocabulary cross-checked against Fashionpedia's parts and attributes (CC BY 4.0) and the Getty Art &
# Architecture Thesaurus (ODC-By 1.0); the entries and their coverage are ours.

groups:
  knit: Knit and stretch
  special: Special construction
  body: Body structure
  sleeve: Sleeves and armholes
  cuff: Cuffs and sleeve ends
  neckline: Necklines
  collar: Collars, lapels and hoods
  closure: Closures
  pocket: Pockets
  yoke: Yokes
  shaping: Darts, pleats and fullness
  skirt: Skirt shapes
  leg: Legs
  waist: Waists
  hem: Hems, vents and fronts
  finish: Facings and linings
  cape: Capes
  flat: Flat pieces

