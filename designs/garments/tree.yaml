# The garment family tree: every garment type, by descent, from body zone down to a named type.
# See garments/README.md. Each node:
#   name; parent (none for a zone); traits: the elements (elements.yaml) a type needs;
#   designs: our designs of this type; variants: <design>.<variant> that make it;
#   freesewing: FreeSewing designs of this type, to list as theirs (credited), not ours;
#   knit: true when it's usually cut from knit cloth (our blocks are for woven cloth);
#   note.
# A node's coverage is worked out by tools/garments.mjs: built (it has designs or variants),
# buildable (every trait is covered), partial, or gap.
# Organisation cross-checked against the Getty Art & Architecture Thesaurus (ODC-By 1.0) and
# Fashionpedia's apparel categories (CC BY 4.0); the tree itself is ours.

# Every design in @freesewing/collection 4.10.2 (npm), for the test to check names against
freesewingDesigns: [aaron, albert, ashley, bee, bella, benjamin, bent, bibi, bob, breanna, brian, bruce, carlita, carlton, cathrin, charlie, cornelius, crux, devon, diana, florence, florent, gozer, hannah, hi, holmes, hortensia, huey, hugo, jaeger, jane, jett, lily, lucy, lumina, lumira, lunetius, noble, octoplushy, onyx, opal, otis, paco, penelope, percy, polly, sabrina, sandy, sarah, sasha, shale, shelly, shin, simon, simone, skully, sophie, sunny, sven, tamiko, teagan, tiberius, tina, titan, toni, trayvon, tristan, uma, umbra, wahid, walburga, waralee, yuri]

