# Girls' coat: Sheifer's box coat drafted for children ("Drafting a Box Coat" and "Drafting
# Children's Garments", N. S. Sheifer's System of Designing and Grading Ladies', Misses' &
# Children's Garments, 1908), on the box coat (FreeSewing's Breanna): a loose, straight coat to
# below the knee, side seams flared from the armhole, a small neck dart, a 2 1/2" lap, flap
# pockets below the waist, notched lapel and collar, two-piece sleeves. For any size. See BRIEF.md.
extends: ../womens-box-coat/spec.yaml

about:
  id: girls-coat
  name: Girls' coat
  category: coats
  description: "A loose, single-breasted coat to below the knee, with a notched collar and flap pockets: for girls, or any size"
  difficulty: 3
  tags: [coats, children]
  techniques: [dart, lapel, collar, facing, button, flap-pocket, two-piece-sleeve]
  version: 0.1.0
  source: "Sheifer, System of Designing and Grading Ladies', Misses' & Children's Garments (1908), box coat and children's garments (nssheiferssystem00shei)"
  preview: usdaGirlC8 # the size of the pattern-pieces preview on its page (tools/preview.mjs)

options:
  # Length "according to style"; a child's coat to just below the knee
  lengthBelowWaist: { pct: 58 } # x waistToFloor
  # N: "2 1/2 inches for single breasted", on a 36 bust
  buttonExtension: { pct: 6.9 }
  buttons: { count: 4 }
  # "3 1/2 to 4 inches for double breasted": two rows, the lap 3 3/4" on a 36 bust
  doubleBreasted: { bool: false, menu: style }
  doubleExtension: { pct: 10.4, menu: style }
  buttonRow: { pct: 62, menu: style } # x the lap: each row's distance from CF
  # P: "Pocket 3 inches below waist line", one each side, no ticket pocket
  pocketBelow: { pct: 30 } # x waistToSeat: 3" of FreeSewing's 10"
  ticketPocket: { bool: false }

# The same pattern with other options, shown on its page after the pattern tool
variants:
  double:
    name: Double-breasted
    description: "Two rows of three buttons on the wider lap Sheifer gives for a double-breasted coat."
    options: { doubleBreasted: true, buttons: 3 }
