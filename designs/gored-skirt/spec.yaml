# Gored skirt: Mitchell 1921's five- to fifteen-gored skirts (pp. 84-101) on FreeSewing's Sarah
# skirt block: a front panel on the fold and gores cut in pairs, each seam taking a dart's share
# of the waist shaping above the seat line and flaring below it, a CB zip and a waistband. See
# BRIEF.md for where each default is read.
about:
  id: gored-skirt
  name: Gored skirt
  description: A flared skirt of five to fifteen gores, the waist shaped in its seams, with a CB zip and a waistband
  difficulty: 2
  tags: [bottoms]
  techniques: [zip, waistband, hem]
  version: 0.1.0
  source: Mitchell, Ladies' Tailor-Made Garments (1921), skirt foundation and gored skirts, pp. 84-101 (mitchell)

block: sarah

options:
  gores: { dflt: 5, list: [5, 7, 9, 11, 13, 15], menu: style } # p. 90: five; pp. 92-101: seven to fifteen
  panelNarrowing: { pct: 1.25, min: 0, max: 4, of: seat, menu: style } # five gores: 1/2 in less than an equal share, of a 40 in hip
  goreFlare: { pct: 70, min: 0, max: 150, menu: style } # x the half seat, added at the hem at floor length: the sweeps' 1.7
  cbShaping: { pct: 21, min: 0, max: 40, menu: advanced } # x the waist shaping, at the CB seam, five gores: 7/8 of 4 1/8 in
  panelShaping: { pct: 18, min: 0, max: 40, menu: advanced } # x the waist shaping, at the panel seam, five gores: 1/4 + 1/2 of 4 1/8 in
  frontWaistDrop: { pct: 16, min: 0, max: 25, menu: fit } # x the waist-to-seat depth: CF 1 1/8 in shorter, of 7 in
  zipLength: { pct: 100, min: 60, max: 130, menu: style } # x the waist-to-seat depth, on the CB seam
  waistbandHeight: { pct: 3, min: 2, max: 6, of: waistToFloor, menu: style } # finished
  # Sarah's own: the length (p. 84: the back length, 39 1/2 in, nearly to the floor), and its
  # straight skirt's darts and side seams, which the gores replace (no menu: not shown)
  length: { pct: 95, min: 25, max: 100, menu: style } # x waist to floor
  centerFrontSeam: { bool: false }
  centerBackSeam: { bool: false }
  waistEaseFront: { pct: 10, min: 0, max: 20 }
  waistEaseBack: { pct: 17, min: 0, max: 30 }
  waistRise: { pct: 6, min: 0, max: 10 }
  sideSeamCurveOffset: { pct: 2.5, min: 0, max: 5 }
  backOutsideDartLength: { pct: 63, min: 50, max: 75 }
  backInsideDartLength: { pct: 68, min: 50, max: 75 }
  frontDartLength: { pct: 58, min: 40, max: 80 }

pieces:
  layout:
    from: sarah.base
    hide: tree
    options: all
    ops:
      - skirtLayout:
          gores: gores
          panelNarrowing: seat * panelNarrowing
          cbShaping: cbShaping
          panelShaping: panelShaping
          flare: goreFlare
          frontDrop: waistToSeat * frontWaistDrop
  frontPanel: { part: gore, index: 0, after: layout, nr: 1 }
  gore1: { part: gore, index: 1, after: layout, nr: 2, zip: waistToSeat * zipLength }
  gore2: { part: gore, index: 2, after: layout, nr: 3, zip: waistToSeat * zipLength }
  gore3: { part: gore, index: 3, after: layout, nr: 4, zip: waistToSeat * zipLength }
  gore4: { part: gore, index: 4, after: layout, nr: 5, zip: waistToSeat * zipLength }
  gore5: { part: gore, index: 5, after: layout, nr: 6, zip: waistToSeat * zipLength }
  gore6: { part: gore, index: 6, after: layout, nr: 7, zip: waistToSeat * zipLength }
  gore7: { part: gore, index: 7, after: layout, nr: 8, zip: waistToSeat * zipLength }
  waistband:
    part: strip
    after: layout
    nr: 9
    fold: true
    length: skirt.waist + waistToFloor * waistbandHeight
    width: waistToFloor * waistbandHeight
