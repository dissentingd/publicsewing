# Jeans: five-pocket jeans, inspired by Joseph-Armstrong (Patternmaking for Fashion Design, 2010) and
# Aldrich (Metric Pattern Cutting for Women's Wear, 2015); methods and proportions only. On the
# suit trousers' Titan legs, fitted close: a contour waistband cut off the top of the legs, a back yoke
# with the dart closed in it, scooped front pockets with a facing, bag and coin pocket, patch back
# pockets, a zip fly, belt loops and rivets. For any size, children's included. See BRIEF.md.
extends: ../suit-trousers/spec.yaml

about:
  id: jeans
  name: Jeans
  category: trousers
  description: "Five-pocket jeans: a contour waistband, a back yoke, scooped front pockets with a coin pocket, patch back pockets, a zip fly and rivets"
  difficulty: 3
  tags: [bottoms, workwear]
  techniques: [zip, patch-pocket, waistband, topstitch, hem]
  version: 0.1.0
  source: "Helen Joseph-Armstrong, Patternmaking for Fashion Design, 5th ed. (Pearson, 2010); Winifred Aldrich, Metric Pattern Cutting for Women's Wear, 6th ed. (Wiley, 2015)"
  taken: close fit, contour waistband, yoke and pocket proportions # the design page: "its ... follow" the book
  preview: cisFemaleAdult30

options:
  # The contour fit: very little ease at the seat
  seatEase: { pct: 1.5 }
  waistEase: { pct: 4 }
  kneeEase: { pct: 15 }
  hemWidth: { pct: 73, min: 50, max: 130 } # x the knee
  hemShaping: { pct: 0 } # straight across
  frontDart: { pct: 0, menu: false } # the dartless jean front
  frontDartLength: { menu: false }
  # The back dart: its point moves to the yoke seam
  backDart: { pct: 15 }
  backDartLength: { pct: 38, menu: false }
  turnUps: { bool: false, menu: false }
  turnUpDepth: { menu: false }
  sidePockets: { bool: false, menu: false } # the jean pocket instead
  backPocket: { bool: false, menu: false } # patch pockets instead
  waistbandHeight: { pct: 3.8, min: 2.5, max: 6 }
  flyWidth: { pct: 5.6 }
  beltLoops: { count: 5 } # ours
  # Yoke seam, measured from the waist
  yokeDepth: { pct: 37, min: 20, max: 50, of: waistToSeat, menu: style, description: "How far down the centre back seam the back yoke's seam meets it, from the waist, as a share of waist to seat." } # at CB
  yokeSide: { pct: 31, min: 18, max: 45, of: waistToSeat, menu: style }
  # Front pocket opening: along the top, and down the side
  pocketEntryWidth: { pct: 10.8, min: 7, max: 16, of: seat, menu: style }
  pocketEntryDepth: { pct: 34, min: 22, max: 45, of: waistToSeat, menu: style }
  # Pocket bag; its facing is shorter
  pocketBagWidth: { pct: 13.5, min: 10, max: 20, of: seat, menu: advanced }
  pocketBagDepth: { pct: 86, min: 55, max: 100, of: waistToSeat, menu: advanced }
  # Coin pocket on the facing
  coinPocket: { bool: true, menu: style }
  coinPocketWidth: { pct: 7.4, min: 5, max: 10, of: seat, menu: advanced }
  # Pointed back patch pocket, below the yoke seam
  backPocketWidth: { pct: 16.2, min: 11, max: 20, of: seat, menu: style }
  backPocketDepth: { pct: 16.2, min: 11, max: 22, of: seat, menu: style }
  backPocketPoint: { pct: 12.5, min: 0, max: 25, menu: style } # x the depth
  rivets: { bool: true, menu: style }

pieces:
  front:
    prefix: trousers
    from: titan.front
    hide: tree
    options: all
    measurements: [waistToSeat]
    let:
      d: (seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
    ops:
      - trouserLeg:
          which: front
          dart: d * frontDart
          dartAt: 0.55
          dartLength: waistToSeat * frontDartLength
          hemWidth: hemWidth
          hemSag: waistToFloor * hemShaping
          fly: waist * flyWidth
          flyLength: waistToSeat * 1.05
          keepOutline: true
      - jeanLeg:
          which: front
          band: waistToFloor * waistbandHeight
          entryW: seat * pocketEntryWidth
          entryD: waistToSeat * pocketEntryDepth
          bagW: seat * pocketBagWidth
          bagD: waistToSeat * pocketBagDepth
          facingD: waistToSeat * pocketBagDepth * 0.71
          coin: coinPocket
          coinW: seat * coinPocketWidth
          coinH: seat * coinPocketWidth * 1.18
          coinInset: seat * 0.027
          coinTop: seat * 0.027
          rivets: rivets
  back:
    prefix: trousers
    from: titan.back
    after: front
    hide: tree
    options: all
    measurements: [waistToSeat]
    let:
      d: (seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
    ops:
      - trouserLeg:
          which: back
          matchOutseam: trousers.front.outseam
          dart: d * backDart
          dartAt: 0.4
          dartFrom: centre
          dartLength: waistToSeat * backDartLength
          hemWidth: hemWidth
          hemSag: waistToFloor * hemShaping
          keepOutline: true
      - jeanLeg:
          which: back
          band: waistToFloor * waistbandHeight
          yokeIn: waistToSeat * yokeDepth
          yokeOut: waistToSeat * yokeSide
          pocketW: seat * backPocketWidth
          pocketBottom: seat * backPocketWidth * 0.833
          pocketD: seat * backPocketDepth
          pocketPoint: seat * backPocketDepth * backPocketPoint
          pocketBelow: waistToSeat * 0.124
          rivets: rivets
  # The contour waistband, CB to CF; the left side's runs on past CF over the fly shield: cut two of
  # each side (band and facing)
  waistband:
    prefix: trousers
    part: jeanBand
    after: [back, front]
    nr: 3
    width: waistToFloor * waistbandHeight
    ext: waist * 0.047
  yoke:
    prefix: trousers
    part: jeanPiece
    key: yoke
    after: back
    nr: 10
    label: yoke
  pocketFacing:
    prefix: trousers
    part: jeanPiece
    key: facing
    after: front
    nr: 11
    label: pocketFacing
  pocketBag:
    prefix: trousers
    part: jeanPiece
    key: bag
    after: front
    nr: 12
    label: pocketBag
    material: lining
  pocketLining:
    prefix: trousers
    part: jeanPiece
    key: bagEntry
    after: front
    nr: 13
    label: pocketLining
    material: lining
  coinPocket:
    prefix: trousers
    part: polygon
    after: front
    nr: 14
    if: coinPocket
    let:
      w: seat * coinPocketWidth
      h: seat * coinPocketWidth * 1.18
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [2, 1, 1, 1]
  backPatchPocket:
    prefix: trousers
    part: polygon
    after: back
    nr: 15
    cut: 2
    let:
      w: seat * backPocketWidth
      b: w * 0.833
      h: seat * backPocketDepth
      p: h * backPocketPoint
    points: [[0, 0], [w, 0], [(w + b) / 2, h - p], [w / 2, h], [(w - b) / 2, h - p]]
    allowance: [2.5, 1, 1, 1, 1]

# The same pattern with other options, shown on its page after the pattern tool
variants:
  tapered:
    name: Tapered leg
    description: "A tapered legline, narrower at the hem."
    options: { hemWidth: 0.6 }
  bootcut:
    name: Bootcut
    description: "A flared legline: the leg a little closer at the knee and flaring out to the hem."
    options: { kneeEase: 0.1, hemWidth: 1.15 }

# No pattern map yet: the suit trousers' would label pieces this design changes.
patternMap: false
