# Jodhpurs: Simons' men's jodhpurs (Drafting Trousers, 1945, Diagram 18, pp. 70-73), with his ladies'
# jodhpurs (Diagram 45, pp. 133-136) as a variant, on the breeches' Titan legs: full over the seat and
# flared at the side of the thigh, close from the knee down, then carried on almost straight to the
# ankle and finished like trousers with a turn-up cuff. Waist, fly, pockets and waistband as the
# trousers. For any size. See BRIEF.md.
extends: ../breeches/spec.yaml

about:
  id: jodhpurs
  name: Jodhpurs
  category: trousers
  description: "Riding trousers full at the thigh and flared at the side, close from the knee down to the ankle, with turn-up cuffs"
  difficulty: 3
  tags: [bottoms]
  techniques: [dart, zip, welt-pocket, waistband, hem]
  version: 0.1.0
  source: "Simons, Drafting Trousers (1945), Men's Jodhpurs, Diagram 18, pp. 70-73, and Ladies' Jodhpurs, Diagram 45, pp. 133-136 (simonsdraftingtrousers1945)"
  preview: cisMaleAdult38 # Simons drafts waist 34, seat 40

options:
  # Waist 34, seat 40, rise 11 including a 2 in band, inseam 31, knee 15, calf 14 1/2, bottom 15
  # (Diagram 18), on cisMaleAdult38 (seat 40.2, knee 16.1, ankle 9.25, knee to floor 20.5)
  # Knee: forepart 1/2 knee (7 1/2), the back 5/8 in wider each side (8 3/4): 16 1/4 on 16.1
  kneeEase: { pct: 5 }
  legBalance: { pct: 54 } # back's share at the knee: 8 3/4 of 16 1/4
  # "S is 1 1/4 inches from B": the forepart's side 1 1/4 in out at the thigh, "not an extreme style"
  thighFlare: { pct: 3.1, min: 0, max: 10, of: seat, menu: style } # 1 1/4 / 40
  # "16 is 1 1/2 inches from S": the back's side 1 1/2 in past the forepart's, of which 5/8 in is the
  # back's extra width anyway: 1 1/4 + 7/8 = 2 1/8 from its own line
  backFlare: { pct: 170, min: 100, max: 300, menu: advanced } # x the forepart's flare
  # Calf 14 1/2: forepart 7 1/4, back 8 1/2 = 15 3/4 on a 16.1 knee; "F is 5 inches from E", E an inch
  # below the regular knee: 6 in below it on 20.5
  calfWidth: { pct: 98 }
  calfAt: { pct: 29 }
  # Bottom 15: forepart 7 1/2, back 8 3/4 = 16 1/4 on a 9 1/4 ankle; "drafted almost straight" from the calf
  cuffWidth: { pct: 176, min: 120, max: 220 }
  # "The jodhpurs finish off at the bottom like a regular pair of trousers": to the instep, about 1 1/2 in
  # above the floor
  breechesLength: { pct: 93, min: 70, max: 100 }
  # "Generally made with a 1 1/2 inch cuff": on his waist to floor of about 40 (rise 9, inseam 31)
  turnUps: { bool: true, menu: style }
  turnUpDepth: { pct: 3.75, menu: style }
  waistbandHeight: { pct: 5 } # "The waistband should be made to finish 2 inches"
  # The opening: a fly (men's), or the side with a facing (ladies': "A side facing of 1 1/2 inches")
  opening: { dflt: fly, list: [fly, side], menu: style }
  zipLength: { pct: 75, min: 50, max: 110, menu: style, description: "Length of the zip in the left side seam, as a share of waist to seat." }
  sideUnderlap: { pct: 5.4, min: 0, max: 12, of: waist, menu: style } # 1 1/2 on a 28 waist
  # No buttoned leg opening: the leg is wide enough at the bottom to go on over the foot
  openingTop: { menu: false }
  breechesButtons: { menu: false }
  breechesOpening: { menu: false }
  frontOpening: { menu: false }

pieces:
  front:
    prefix: trousers
    from: titan.front
    hide: tree
    options: all
    measurements: [waistToSeat, ankle]
    let:
      d: (seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
      below: waistToFloor - waistToKnee
    ops:
      - trouserLeg:
          which: front
          dart: d * frontDart
          dartAt: 0.55
          dartLength: waistToSeat * frontDartLength
          fly: if(opening == 'fly', waist * flyWidth, 0)
          flyLength: waistToSeat * 1.05
          sideZip: if(opening == 'side', waistToSeat * zipLength, 0)
          # "The front pocket is placed 6 inches down from point 8": on the side seam
          pocketTop: if(sidePockets, waistToSeat * 0.18, 0)
          pocketLength: if(sidePockets, waistToSeat * 0.85, 0)
          pocketWidth: seat * 0.08
          pocketDepth: waistToSeat * 0.45
          share: 1 - legBalance
          thighFlare: seat * thighFlare
          thighAt: thighAt
          calfBelow: below * calfAt
          calfW: knee * calfWidth
          cuffBelow: below * breechesLength
          cuffW: ankle * cuffWidth
          turnUp: if(turnUps, waistToFloor * turnUpDepth, 0)
  back:
    prefix: trousers
    from: titan.back
    after: front
    hide: tree
    options: all
    measurements: [waistToSeat, ankle]
    let:
      d: (seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
      below: waistToFloor - waistToKnee
    ops:
      - trouserLeg:
          which: back
          matchOutseam: trousers.front.outseam
          dart: d * backDart
          dartAt: 0.4
          dartFrom: centre
          dartLength: waistToSeat * backDartLength
          sideZip: if(opening == 'side', waistToSeat * zipLength, 0)
          pocketTop: if(sidePockets, waistToSeat * 0.18, 0)
          pocketLength: if(sidePockets, waistToSeat * 0.85, 0)
          # "The back pocket is drawn parallel to the top seam and should be 5 inches long"
          backPocket: if(backPocket, seat * 0.125, 0)
          backPocketBelow: waistToSeat * 0.4
          backPocketWelt: seat * 0.006
          share: legBalance
          # at most 15% of the seat: past about 16% the back's outseam can't be matched to the front's
          thighFlare: seat * min(thighFlare * backFlare, 0.15)
          thighAt: thighAt
          calfBelow: below * calfAt
          calfW: knee * calfWidth
          cuffBelow: below * breechesLength
          cuffW: ankle * cuffWidth
          turnUp: if(turnUps, waistToFloor * turnUpDepth, 0)
  # With a fly, the trousers' waistband: two halves joined at CB, the left running on over the fly
  # ("17 inches for 1/2 the waist and 2 1/2 inches extra for outlets in the seat and for the turn in")
  waistband:
    prefix: trousers
    part: strip
    after: [back, front]
    nr: 3
    cut: 2
    fold: true
    options: [waistbandHeight, opening, flyWidth]
    length: trousers.back.waist + trousers.front.waist + waist * flyWidth * 1.2
    width: waistToFloor * waistbandHeight
    if: opening == 'fly'
  # With a side opening, one strip round the whole waist, lapping on past the opening
  sideWaistband:
    prefix: trousers
    part: strip
    after: [back, front]
    nr: 3
    fold: true
    options: [waistbandHeight, opening, sideUnderlap]
    length: 2 * (trousers.back.waist + trousers.front.waist) + waist * sideUnderlap
    width: waistToFloor * waistbandHeight
    if: opening == 'side'
  flyShield:
    prefix: trousers
    part: strip
    after: front
    nr: 4
    fold: true
    length: trousers.front.fly + 20
    width: trousers.front.flyWidth * 1.3
    if: opening == 'fly'
  flyFacing:
    prefix: trousers
    part: strip
    after: front
    nr: 5
    length: trousers.front.fly + 20
    width: trousers.front.flyWidth * 1.3
    if: opening == 'fly'
  # No buttoned opening at the leg
  buttonStand:
    part: strip
    after: back
    nr: 10
    length: 100
    width: 30
    if: false
  openingFacing:
    part: strip
    after: front
    nr: 11
    length: 100
    width: 40
    if: false

# The same pattern with other options, shown on its page after the pattern tool
variants:
  ladies:
    name: Ladies' jodhpurs
    description: "Simons' ladies' jodhpurs (Diagram 45): fuller at the top of the leg, especially at the back, a little roomier from the knee down, a 1 1/4 inch cuff, and a zip in the left side seam instead of a fly."
    # Waist 28, seat 38, knee 13 1/2, calf 13, bottom 14, on cisFemaleAdult32 (knee 14.4, knee to floor
    # 17.6): "3 is 1 1/2 inches from 2" (1 1/2 / 38), "27 is 3 inches from 3", the back 1 in wider each
    # side (1 1/2 + 2 = 3 1/2 in from its own line); knee 6 3/4 + 8 3/4 = 15 1/2; calf 6 1/2 + 8 1/2 = 15;
    # "E is 5 1/2 inches from D"; "A 1 1/4 inch cuff" on about 39
    options: { opening: side, thighFlare: 0.039, backFlare: 2.3, kneeEase: 0.08, legBalance: 0.56, calfWidth: 1.04, calfAt: 0.31, turnUpDepth: 0.032 }
