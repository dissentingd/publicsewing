# Kameez, inspired by CBSE's Basic Pattern Development (2014); methods and proportions only. On the
# shift dress: front and back each in one piece, flared from the armhole to the hem, slit up the sides,
# a round neck with a short opening and plain hemmed sleeves. For any size. See BRIEF.md.
extends: ../shift-dress/spec.yaml

about:
  id: kameez
  name: Kameez
  category: dresses
  description: "A long A-line tunic slit up the sides, with a round neck and short plain sleeves, to wear over a salwar or trousers"
  difficulty: 2
  tags: [dresses, tops]
  techniques: [placket, facing, hem]
  version: 0.1.0
  source: "Central Board of Secondary Education with the National Institute of Fashion Technology, Basic Pattern Development: Students Handbook + Practical Manual, Class XII (CBSE, 2014)"
  garmentTraditions: [punjab-patternmaking]
  taken: A-line shape, slits and sleeve proportions
  preview: cisFemaleAdult32

options:
  chestEase: { pct: 12 }
  hemFlare: { pct: 8.3 }
  skirtLength: { pct: 50 }
  sideSlit: { pct: 50, min: 0, max: 80 }
  hemCorner: { pct: 0 }
  # A short opening at the front neck, under a binding (ours)
  opening: { dflt: front, list: [back, front], menu: style }
  placketDepth: { pct: 45 }
  buttons: { count: 1, min: 1, max: 6, menu: style }
  neckFinish: { dflt: binding, list: [binding, band, collar], menu: style } # the jewel neck
  sleeves: { dflt: short, list: [long, short, none], menu: style }
  shortSleeve: { pct: 46, min: 15, max: 70, menu: style }
  sleeveFinish: { dflt: hem, list: [band, hem], menu: style }

pieces:
  sleeve: { part: yokeSleeve, after: [backBase, frontBase], nr: 5, options: [sleeveFinish] }
  sleeveBand: { part: sleeveBand, after: sleeve, nr: 6, options: [sleeveFinish] }

# The same pattern with other options, shown on its page after the pattern tool
variants:
  straight:
    name: Straight kameez
    description: "Straighter side seams with only a slight flare, slit up the sides."
    options: { hemFlare: 0.04 }
  long-sleeves:
    name: Long sleeves
    description: "Plain narrow sleeves to the wrist, hemmed."
    options: { sleeves: long }
