# Sewing order for the independently written numbered steps in BRIEF.md.
# Codes are defined in spec.yaml's patternMap.
design: kimono-jacket
steps:
  - { order: 1, action: join princess seams, seams: [PF, PB], stitches: [SS] }
  - { order: 2, action: make hip welt pockets, placements: [P14], stitches: [SS], whenAny: [pockets] }
  - { order: 3, action: make breast welt pocket, placements: [P12], stitches: [SS], whenAny: [breastPocket] }
  - { order: 4, action: make ticket welt pocket, placements: [P17], stitches: [SS], whenAny: [ticketPocket] }
  - { order: 5, action: join shoulder and overarm seams, seams: [A], stitches: [SS] }
  - { order: 6, action: join side and underarm seams, seams: [B], stitches: [SS] }
  - { order: 7, action: attach collar and facings, seams: [D, E], stitches: [SS] }
  - { order: 8, action: finish hems and front fastening, seams: [H], placements: [BH], stitches: [HS, BH] }
