# Labels for the pattern tool (publicsewing.org): a title and description for every option the
# specs and lib/ define, choice titles for list options, and part names. Shared by all designs:
# an option name means the same thing everywhere. A spec option can override its label with
# `title:` and `description:` (lib/spec.mjs strips them before FreeSewing sees the option).
# Options a block defines (Brian's armhole factors, Titan's crotch curve...) keep the block's
# own labels. "x waist to seat" etc.: the option is a fraction of that measurement.

options:
  # Fit
  chestEase:
    title: Chest ease
    description: Room added to the chest measurement, as a share of the chest.
  waistEase:
    title: Waist ease
    description: Room added at the waist when the side seams are shaped in, as a share of the waist.
  seatEase:
    title: Seat ease
    description: Room added over the seat; the side seams are let out to it where needed.
  bodyEase:
    title: Body ease
    description: Room added round the body, as a share of the chest or the seat, whichever is larger.
  crotchDrop:
    title: Crotch drop
    description: How far below the body's crotch the legs divide, as a share of the neck to waist and waist to upper leg together.
  cbSuppression:
    title: Back seam shaping
    description: How far the centre back seam comes in at the waist, as a share of half the seat less half the waist.
  cbSeat:
    title: Back seam at the seat
    description: How much of the centre back seam's waist shaping is still taken in at the seat line.
  underarmSuppression:
    title: Under-arm seam shaping
    description: How much the under-arm panel's back seam takes in at the waist, as a share of half the seat less half the waist.
  bicepsEase:
    title: Biceps ease
    description: Room added round the upper arm, as a share of the biceps.
  cuffEase:
    title: Cuff ease
    description: Width of the sleeve at the hem, as a share of the wrist.
  kneeBandEase:
    title: Knee band ease
    description: Room in the knee band, as a share of the knee.
  waistShaping:
    title: Shape the waist
    description: Take the side seams in at the waist instead of hanging straight.
  stoutDrop:
    title: Regular waist drop
    description: >
      How much smaller than the chest a regular waist is. A waist larger than that is drafted as
      a stout figure, with extra room at the front.
  neckDartWidth:
    title: Neck dart width
    description: Width of the dart from the front neck towards the bust, as a share of the chest.
  backShare:
    title: Back's share of the shaping
    description: How much of the waist shaping is taken from the back pieces rather than the front.
  waistDart:
    title: Waist dart
    description: A waist dart in the block.
  shoulderDart:
    title: Shoulder dart
    description: A shoulder dart in the block.
  primaryBustDart:
    title: Bust dart position
    description: Where the block's bust dart points.
  secondaryBustDart:
    title: Second bust dart
    description: A second bust dart in the block.

  # Length and shape
  lengthBelowWaist:
    title: Length below the waist
    description: Hem length below the waist, as a share of waist to seat.
  skirtLength:
    title: Skirt length
    description: Waist to hem, as a share of waist to floor. About 45% reaches the knee.
  frontDrop:
    title: Front drop
    description: How much lower the front hem hangs than the back, as a share of waist to seat.
  hemCurve:
    title: Rounded front corners
    description: How much the front hem corners are rounded. 0% is square.
  hemCorner:
    title: Rounded side corners
    description: How much the hem corners at the side slits are rounded.
  hemFlare:
    title: Hem flare
    description: Extra width at each side seam at the hem, as a share of the seat.
  flare:
    title: Side flare
    description: Extra width at the hem on each side of the side seam, as a share of the seat.
  cbFlare:
    title: Centre-back flare
    description: How far the centre back steps out towards the hem. 0% cuts the back on the fold.
  sideSlit:
    title: Side slits
    description: Slits up the side seams from the hem, as a share of waist to hem. 0% is none.
  gathers:
    title: Gathers
    description: Width of the gathered edge before gathering, against the edge it's sewn to.
  blouse:
    title: Blouse over the band
    description: Extra leg length that hangs over the knee band.
  legFlare:
    title: Leg fullness
    description: Extra width at the outside leg seam, as a share of the seat. Below 0% the leg tapers.
  shoulderStraps:
    title: Shoulder straps
    description: Epaulettes on the shoulders, buttoned at the neck end.
  bibHeight:
    title: Bib height
    description: How far the bib rises above the waist, as a share of waist to floor.
  bibWidth:
    title: Bib width
    description: Across the top of the bib, as a share of the waist.
  bibInset:
    title: Bib foot
    description: How far in from the side seam the bib meets the waist, as a share of the waist.
  backRise:
    title: Back height
    description: How far the back rises above the waist at centre back, as a share of waist to floor.
  backRiseTop:
    title: Back top width
    description: Across the top of the raised back, each side of centre back, as a share of the waist.
  sideOpening:
    title: Side opening
    description: Length of the buttoned opening at the top of each side seam, as a share of waist to floor.
  strapWidth:
    title: Strap width
    description: Finished width of the straps, as a share of the waist.
  bibPocket:
    title: Bib pocket
    description: A patch pocket on the bib.
  hipPockets:
    title: Hip pockets
    description: A patch pocket on each front, below the waist.
  seatPockets:
    title: Seat pockets
    description: A patch pocket on each back.
  pleats:
    title: Pleats
    description: Number of pleats at each front waist.
  pleatSpacing:
    title: Pleat spacing
    description: Gap between the front pleats, as a share of the seat.
  thighFlare:
    title: Thigh flare
    description: How far the outside leg seam flares out at the thigh, as a share of the seat (the back a little more).
  thighAt:
    title: Flare position
    description: Where the thigh flare is widest, as a share of the way from the crotch to the knee.
  calfWidth:
    title: Calf width
    description: Round the leg at the calf line, as a share of the knee measurement.
  calfAt:
    title: Calf line
    description: How far below the knee the calf line falls, as a share of knee to floor.
  cuffWidth:
    title: Cuff width
    description: Round the leg at the bottom, as a share of the ankle measurement.
  breechesLength:
    title: Breeches length
    description: Where the leg ends below the knee, as a share of knee to floor.
  openingTop:
    title: Opening top
    description: How far below the knee the buttoned opening at the side starts, as a share of knee to floor.
  breechesButtons:
    title: Buttons at the leg
    description: Number of buttons closing the opening at the side of the lower leg.
  legLength:
    title: Leg length
    description: Where the leg ends, as a share of waist to floor.
  bandBelowKnee:
    title: Band below the knee
    description: Where the knee band sits, below the knee, as a share of waist to knee.
  bandWidth:
    title: Knee band width
    description: Finished width of the knee band, as a share of the knee.
  hemWidth:
    title: Hem width
    description: Width of the leg at the hem, as a share of its width at the knee.
  hemShaping:
    title: Hem shaping
    description: How far the hem curves down at the back crease and up at the front, so it sits level over the shoe, as a share of waist to floor.
  backDart:
    title: Back dart
    description: Width of the back waist dart, as a share of the difference between seat and waist (with ease) on each half.
  backDartLength:
    title: Back dart length
    description: Length of the back waist dart, as a share of waist to seat.
  frontDart:
    title: Front dart
    description: Width of the front waist dart at the crease, as a share of the difference between seat and waist (with ease) on each half. 0% is none.
  frontDartLength:
    title: Front dart length
    description: Length of the front waist dart, as a share of waist to seat.
  gores:
    title: Gores
    description: How many pieces go round the skirt, the front panel included.
    choices: { 5: Five, 7: Seven, 9: Nine, 11: Eleven, 13: Thirteen, 15: Fifteen }
  panelNarrowing:
    title: Front panel narrowing
    description: How much narrower the front panel is at the seat than an equal share, as a share of the seat (for five gores; less with more).
  goreFlare:
    title: Flare
    description: Extra width at the hem of a floor-length skirt, as a share of the half seat, shared equally by the seams; a shorter skirt flares in proportion.
  cbShaping:
    title: Centre back shaping
    description: The centre back seam's share of the waist shaping (for five gores; less with more).
  panelShaping:
    title: Front panel shaping
    description: The front panel seams' share of the waist shaping (for five gores; less with more). The other seams share the rest.
  frontWaistDrop:
    title: Front waist drop
    description: How much lower the waist sits at centre front than at centre back, as a share of waist to seat.
  zipLength:
    title: Zip length
    description: Length of the zip in the centre back seam, as a share of waist to seat.
  waistbandHeight:
    title: Waistband height
    description: Finished height of the waistband, as a share of waist to floor.
  flyWidth:
    title: Fly width
    description: How far the fly's stitching line sits from the centre front, as a share of the waist.
  sidePockets:
    title: Side pockets
    description: Pockets in the side seams.
  backPocket:
    title: Back pocket
    description: A jetted pocket in each back, below the dart.
  beltLoops:
    title: Belt loops
    description: Number of belt loops on the waistband. 0 is none.
  armholeDrop:
    title: Armhole depth
    description: How much lower than a sleeved garment's the sleeveless armhole is cut, as a share of the chest.
  shoulderLength:
    title: Shoulder length
    description: Length of the shoulder seam, as a share of the block's (a waistcoat's armhole is cut in at the shoulder).
  cutaway:
    title: Cutaway point
    description: How much of the front point is cut off at an angle, as a share of the chest. 0 leaves it square.
  neckDepth:
    title: Neck depth
    description: How far the V neck runs below the front neck, as a share of the chest.
  liningBack:
    title: Lining-fabric back
    description: Cut the back from lining fabric, as is usual for a waistcoat.
  casing:
    title: Waist casing
    description: Width of the elastic in the waist casing, as a share of the waist.
  backSeamAt:
    title: Back seam position
    description: Where the back princess seam meets the shoulder, along it from the neck.

  # Sleeves
  sleeves:
    title: Sleeves
    description: Whether the garment has sleeves, and which.
    choices: { long: Long, short: Short, none: None }
  sleeveStyle:
    title: Sleeve style
    description: Set-in sleeves, or raglan sleeves running up to the neck.
    choices: { setIn: Set-in, raglan: Raglan }
  sleeveLengthBonus:
    title: Sleeve length
    description: Lengthen (or shorten, below 0%) the sleeve, as a share of its length.
  shortSleeve:
    title: Short sleeve length
    description: Length of a short sleeve, as a share of shoulder to wrist.
  sleeveBand:
    title: Sleeve band width
    description: Finished width of the band or cuff at the sleeve hem.
  sleeveBandEase:
    title: Sleeve band ease
    description: Room in the sleeve band round the wrist.

  # Neck, collar and lapel
  neckStyle:
    title: Neck style
    description: A standing collar, or an open neck.
    choices: { stand: Stand collar, open: Open }
  neckFinish:
    title: Neck finish
    description: Finish the neck with a binding, a band collar, or a turn-down collar.
    choices: { binding: Binding, band: Band, collar: Turn-down collar }
  bandHeight:
    title: Neck band height
    description: Height of the band collar, as a share of the neck.
  collarStyle:
    title: Collar style
    description: >
      Convertible (wears open or buttoned to the neck), military (standing), shawl (cut in one
      with the front) or ulster (a deep turn-down collar with a lapel).
    choices: { convertible: Convertible, military: Military, shawl: Shawl, ulster: Ulster }
  collarHeight:
    title: Collar height
    description: Height of the standing collar, as a share of the neck.
  collarWidth:
    title: Collar width
    description: Width of the collar at the centre back, as a share of the neck.
  hood:
    title: Hood
    description: A hood sewn to the neckline in place of the collar.
  hoodHeight:
    title: Hood height
    description: Length of the hood's face edge, from the neckline to the crown, as a share of the head.
  hoodDepth:
    title: Hood depth
    description: Depth of the hood across the crown, front to back, as a share of the head.
  hoodCorner:
    title: Hood rounding
    description: How round the back of the hood is at the crown, as a share of the hood's depth.
  hoodLean:
    title: Hood tilt
    description: How far the hood's face edge leans forward, in degrees.
  hoodNeckDrop:
    title: Hood neck curve
    description: How far the hood's neck edge drops toward the face, as a share of its length.
  hoodDrawstring:
    title: Hood drawstring
    description: A casing for a drawstring along the hood's face edge.
  collarSpring:
    title: Collar spring
    description: >
      How much the collar's neck edge curves. More spring makes the collar stand away from the
      neck; less makes it hug it.
  collarPoint:
    title: Collar point
    description: How far the collar point reaches past the end of the neck edge.
  lapelStyle:
    title: Lapel style
    description: A notched lapel, or a peaked one pointing up.
    choices: { notch: Notched, peak: Peaked }
  lapelWidth:
    title: Lapel width
    description: Width of the lapel, as a share of the neck.
  breakBelowBust:
    title: Lapel break
    description: Where the lapel turns back, below the bust line.
  rollOut:
    title: Lapel roll line
    description: How far in front of the neck point the lapel's fold line starts.
  gorgeAt:
    title: Gorge position
    description: Where the collar meets the lapel, along the front neck from the neck point.
  neckDartAt:
    title: Neck dart position
    description: Where the neck dart starts, along the front neck from the neck point.
  neckDartLength:
    title: Neck dart length
    description: How far the neck dart reaches towards the bust point.

  totalLength:
    title: Length
    description: Shoulder to hem, as a share of the wearer's height from the neck to the floor.
  legTaper:
    title: Leg taper
    description: How much narrower the leg is at the hem than at the top, as a share of half the body's width.
  crotchGusset:
    title: Crotch gusset
    description: Side of the diamond gusset set into the crotch, as a share of the seat.
  armGusset:
    title: Underarm gusset
    description: Side of the square gusset set under each arm, as a share of the biceps.
  neckWidth:
    title: Neck width
    description: Width of the neck opening each side of the centre front and centre back, as a share of the neck.
  frontNeckDepth:
    title: Front neck depth
    description: How far the front neck curves down at the centre front, as a share of the neck.

  underarmBack:
    title: Under-arm panel, back
    description: Where the under-arm panel's back seam leaves the armhole, as a share of the way from the side to the back armhole's innermost point.
  underarmFront:
    title: Under-arm panel, front
    description: Where the under-arm panel's front seam leaves the armhole, as a share of the way from the side to the front armhole's innermost point.

  # Closures
  buttons:
    title: Buttons
    description: Number of buttons (in each row, on a double-breasted front).
  buttonExtension:
    title: Button stand
    description: How far the front extends past the centre front for the buttons.
  zipExtension:
    title: Zip cover
    description: How far each front reaches past the centre front, covering half the zip's teeth.
  buttonInset:
    title: Button position
    description: Buttons' distance from the front edge, as a share of the lap. 100% puts them on the centre front.
  buttonTop:
    title: Top button
    description: How far below the chest line the top button sits.
  breakAt:
    title: Lapel break
    description: Where the lapel turns and the top button sits, as a share of the way from the chest line to the waist.
  buttonBottom:
    title: Bottom button
    description: How far below the waist the bottom button sits, as a share of waist to seat.
  doubleBreasted:
    title: Double-breasted
    description: Two rows of buttons either side of the centre front. Off, one row.
  buttonRow:
    title: Button rows
    description: Distance of each row of buttons from the centre front, as a share of the stand.
  opening:
    title: Opening
    description: Where the garment opens.
    choices: { front: Front, back: Back }
  openingExt:
    title: Opening lap
    description: Width of the lap at the opening, as a share of the chest.
  placketDepth:
    title: Placket length
    description: Length of the placket opening from the neck, as a share of the back neck to waist.
  belt:
    title: Belt
    description: A belt at the waist.
  beltWidth:
    title: Belt width
    description: Finished width of the belt, as a share of the chest.

  # Pockets
  pockets:
    title: Pockets
    description: Pockets on the front.
  pocketShape:
    title: Pocket shape
    description: The shape of the patch pockets' bottom corners.
    choices: { rounded: Rounded, square: Square, pointed: Pointed, chamfered: Chamfered }
  breastPocket:
    title: Breast pocket
    description: A breast pocket.
  breastPockets:
    title: Breast pockets
    description: Breast pockets.
  lowerPockets:
    title: Lower pockets
    description: Pockets below the waist.
  patchFromCF:
    title: Pockets from the centre front
    description: How far behind the centre front each patch pocket starts, as a share of the chest.
  breastPocketAbove:
    title: Breast pocket height
    description: How far above the waist the breast pockets' tops sit, as a share of shoulder to waist.
  breastPocketWidth:
    title: Breast pocket width
    description: Width of each breast pocket, as a share of the chest.
  lowerPocketBelow:
    title: Lower pocket position
    description: How far below the waist the lower pockets' tops sit, as a share of waist to seat.
  lowerPocketWidth:
    title: Lower pocket width
    description: Width of each lower pocket, as a share of the chest.
  patchDepth:
    title: Pocket depth
    description: Depth of each patch pocket, as a share of its width.
  flapRatio:
    title: Flap depth
    description: Depth of each pocket flap, as a share of the pocket's width.
  pencilPocket:
    title: Pencil pocket
    description: A narrow pocket for a pencil beside the breast pocket.
  pocketFlaps:
    title: Pocket flaps
    description: Flaps over the pockets.
  pocketPleat:
    title: Pocket pleat
    description: Depth of the box pleat down the middle of each pocket, as a share of its width.
  pocketBelow:
    title: Pocket position
    description: How far below the waist the pocket mouth sits, as a share of waist to seat.
  pocketFromCF:
    title: Pocket from the front
    description: How far behind the centre front the pocket mouth starts.
  pocketFromSeam:
    title: Pocket from the seam
    description: How far behind the princess seam the pocket mouth starts.
  pocketWidth:
    title: Pocket width
    description: Width of the pocket mouth, as a share of the chest.
  pocketAngle:
    title: Pocket angle
    description: How much the pocket mouth drops towards the side, in degrees.
  flapDepth:
    title: Flap depth
    description: Depth of the pocket flap, as a share of the pocket's width.
  bagDepth:
    title: Pocket bag depth
    description: Depth of the pocket bag, as a share of the pocket's width.
  ticketPocket:
    title: Ticket pocket
    description: A small flap pocket above the right hip pocket.
  ticketAbove:
    title: Ticket pocket position
    description: How far above the hip pocket the ticket pocket sits, as a share of waist to seat.
  ticketWidth:
    title: Ticket pocket width
    description: Width of the ticket pocket, as a share of the hip pocket's.
  ticketFlapDepth:
    title: Ticket flap depth
    description: Depth of the ticket pocket's flap, as a share of its width.
  handPockets:
    title: Hand-warmer pockets
    description: Slanted welt pockets at hand height, opening towards the front.
  handPocketTop:
    title: Hand pocket height
    description: How far above the waist the top of the hand pocket sits, as a share of waist to seat.
  handPocketAt:
    title: Hand pocket position
    description: How far behind the centre front the top of the hand pocket sits.
  handPocketLength:
    title: Hand pocket length
    description: Length of the hand pocket's mouth.
  handPocketLean:
    title: Hand pocket slant
    description: How much the hand pocket leans towards the side as it goes down.
  handPocketWelt:
    title: Hand pocket welt
    description: Finished width of the hand pocket's welt.
  weltBelow:
    title: Breast welt position
    description: How far below the bust line the front end of the breast welt sits.
  weltFromCF:
    title: Breast welt from the front
    description: How far behind the centre front the breast welt starts.
  weltLength:
    title: Breast welt length
    description: Length of the breast welt pocket's mouth, as a share of the chest.
  weltRise:
    title: Breast welt angle
    description: How much the breast welt rises towards the side, in degrees.
  weltDepth:
    title: Breast welt depth
    description: Finished depth of the breast welt, as a share of its length.

  # Yokes and backs
  yokeAt:
    title: Yoke
    description: A yoke to the chest line, or a bodice to the waist.
    choices: { chest: Yoke to the chest, waist: Bodice to the waist }
  yokeDepth:
    title: Yoke depth
    description: Depth of the yoke from the neck point, as a share of the way to the chest line.
  frontYokeDepth:
    title: Front yoke depth
    description: Depth of the front yoke at the front edge, as a share of the way from the front neck to the chest line.
  frontYokeArm:
    title: Front yoke at the armhole
    description: Where the front yoke seam meets the armhole, as a share of the way from the front neck to the chest line. Less than the front yoke depth slopes the seam up toward the shoulder.
  frontYoke:
    title: Front yoke
    description: A yoke on the front too. No makes the front one piece, neck to hem.
  actionPleat:
    title: Action pleat
    description: Depth of the pleat in the back below the yoke, for reaching forward.
  pleatAt:
    title: Pleat position
    description: Where the action pleat sits, along the yoke from the centre back.
  vent:
    title: Back vent
    description: A vent up the centre-back seam from the hem.
  ventLength:
    title: Vent length
    description: Length of the vent up from the hem, as a share of waist to seat.
  ventWidth:
    title: Vent lap
    description: How far the vent's lap extends past the centre back.

  # Construction
  facingWidth:
    title: Facing width
    description: Width of the front facing, as a share of the chest.
  neckFacingWidth:
    title: Back-neck facing
    description: Depth of the back-neck facing and its width along the shoulder.
  backFacingDepth:
    title: Back-neck facing depth
    description: Depth of the back-neck facing down the centre back.
  lining:
    title: Lining
    description: Line the body. The facings then run to the shoulder, with a back-neck facing.
  hemDepth:
    title: Hem allowance
    description: Depth of the turned-up hem on the legs and sleeves, as a share of waist to floor.
  quilted:
    title: Quilted lining
    description: Cut the body, yokes, sleeves and hood again in quilted lining.
  liningPleat:
    title: Lining pleat
    description: Extra width at the back lining's centre back, folded into a pleat for movement.

