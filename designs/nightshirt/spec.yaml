# Nightshirt: Walker's "Man's Night-shirt" (Manual of Needlework and Cutting Out, 1909,
# Cutting-out Diagrams No. 8 and 9) on FreeSewing's Brian block: long and straight, a back
# yoke over the shoulders, a front placket, neck band, sleeves into wristbands, side slits
# with rounded corners. See BRIEF.md.
extends: ../templates/yoke.yaml

about:
  id: nightshirt
  name: Nightshirt
  description: "A long, loose nightshirt: back yoke, front placket, neck band, side slits"
  difficulty: 2
  tags: [sleepwear, tops]
  techniques: [yoke, placket, button, band]
  version: 0.1.0
  source: Walker, Manual of Needlework and Cutting Out (1909), Man's Night-shirt (krl00366374)
  preview: cisMaleAdult40 # the size of the pattern-pieces preview on its page (tools/preview.mjs)

options:
  chestEase: { pct: 26, min: 10, max: 45, menu: fit } # half width 17" on a 34" body
  frontYoke: { bool: false, menu: style }
  yokeDepth: { pct: 45, min: 20, max: 90, menu: style } # yoke 22" x 4 1/2"
  gathers: { pct: 100, min: 100, max: 200, menu: style }
  hemFlare: { pct: 0, min: 0, max: 25, menu: style }
  skirtLength: { pct: 62, min: 30, max: 95, menu: style } # 47" front, below the knee
  opening: { dflt: front, list: [back, front], menu: style }
  placketDepth: { pct: 75, min: 20, max: 100, menu: style } # opening to 17"
  buttons: { count: 3, min: 1, max: 8, menu: style }
  neckFinish: { dflt: band, list: [binding, band], menu: style }
  sideSlit: { pct: 30, min: 0, max: 60, menu: style } # side seam from 30 to the foot
  hemCorner: { pct: 50, min: 0, max: 100, menu: style } # the rounded corners C, D
  sleeveBandEase: { pct: 15, min: 5, max: 60, menu: style }
