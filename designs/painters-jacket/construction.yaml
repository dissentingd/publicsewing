# Sewing order for the independently written numbered steps in BRIEF.md.
# Codes are defined in the inherited patternMap in spec.yaml.
design: painters-jacket
steps:
  - { order: 1, action: attach breast pocket, placements: [P7], stitches: [TS], whenAny: [breastPocket] }
  - { order: 2, action: attach lower pockets, placements: [P8], stitches: [TS], whenAny: [lowerPockets] }
  - { order: 3, action: join shoulders and sides and attach facings, seams: [A, B, E], stitches: [FF, SS] }
  - { order: 4, action: make and attach collar, seams: [G, D], stitches: [SS] }
  - { order: 5, action: join and set sleeves and finish cuffs, seams: [F, C], stitches: [FF, SS] }
  - { order: 6, action: finish hems and front fastening, seams: [H], placements: [BH], stitches: [TS, BH] }
