# Peacoat: a hip-length double-breasted reefer on Simons' double-breasted overcoats (Designing
# Overcoat Patterns, 1916, pp. 10-11 and the D.B. ulster collar overcoat, pp. 28-29), on the
# mackinaw's body (lib/coat.mjs, FreeSewing's Brian): a wide button stand, a
# notched lapel and deep ulster collar, two rows of three buttons, hand-warmer welt pockets, a
# back vent and a lining, no belt. See BRIEF.md for where each default is read.
extends: ../mackinaw/spec.yaml

about:
  id: peacoat
  name: Peacoat
  description: "A hip-length, double-breasted wool coat: wide lapels, a deep collar that buttons up, hand-warmer pockets"
  difficulty: 4
  tags: [coats, jackets]
  techniques: [welt-pocket, collar, facing, button]
  version: 0.1.0
  source: "Simons, Designing Overcoat Patterns (1916), pp. 10-11, 28-29 (designingovercoa00simo)"

options:
  # Fit: Simons' D.B. overcoat is "semi-form fitting" (p. 10)
  chestEase: { pct: 22 } # between the mackinaw's 24% and a fitted coat: a peacoat is worn over a sweater
  bicepsEase: { pct: 32 }
  # Style
  lengthBelowWaist: { pct: 130 } # x waistToSeat: hip length, about 31" from the nape (Simons' coats run 40-50")
  frontDrop: { pct: 10 }
  buttonExtension: { pct: 9.2 } # half the stand, of chest: 3 1/2" (the ulster's 7" stand) at breast 38
  buttons: { count: 3 } # three to a row (p. 29)
  buttonTop: { pct: 150 } # x the half stand: 5 1/4" below the chest line (p. 29)
  buttonBottom: { pct: 90 } # x waistToSeat below the waist
  buttonRow: { pct: 74 } # x the half stand: rows 2 5/8" either side of CF (p. 29)
  collarStyle: { dflt: ulster } # the D.B. ulster collar (p. 29): a notched lapel and a deep collar
  collarWidth: { pct: 29 } # x neck: the ulster collar's 4" plus its stand
  lapelWidth: { pct: 30 } # x neck: about 4 1/2" from the crease (p. 29's lapel, 7-8 to the crease)
  vent: { bool: true } # Simons' back has a centre seam (B-H); a short vent below it
  lining: { bool: true }
  belt: { bool: false }
  breastPockets: { bool: false }
  lowerPockets: { bool: false }
  handPockets: { bool: true } # the slanted welt on p. 29, waist to hip line

# The same pattern with other options, shown on its page after the pattern tool
variants:
  shawl:
    name: Shawl collar
    description: "A smooth roll cut in one with the front, from the back of the neck to the top button, in place of the notched lapels and deep collar."
    options: { collarStyle: shawl }
  military:
    name: Military collar
    description: "A deep square-ended collar that stands high, in place of the lapels, with four rows of buttons, the top pair just under the neck, so the coat closes to the throat."
    options: { collarStyle: military, buttons: 4, buttonTop: -4 }
