# Pinafore: Walker's pinafores (Manual of Needlework and Cutting Out, 1909: "Pinafores for
# Infants", "for Standards I. and II. Children", "Pinafore with Shoulder Straps for Child of
# 2 Years") on FreeSewing's Brian block, for any size: a sleeveless over-dress, its front and
# back gathered into a shallow yoke, buttoned at the back. See BRIEF.md.
extends: ../templates/yoke.yaml

about:
  id: pinafore
  name: Pinafore
  description: A sleeveless gathered pinafore to wear over clothes, buttoned at the back
  difficulty: 1
  tags: [dresses, children, aprons]
  techniques: [gathering, yoke, button]
  version: 0.1.0
  source: Walker, Manual of Needlework and Cutting Out (1909), pinafores (krl00366374)
  preview: usdaGirlC3 # the size of the pattern-pieces preview on its page (tools/preview.mjs)

options:
  chestEase: { pct: 22, min: 8, max: 40, menu: fit } # worn over clothes
  sleeves: { dflt: none, list: [long, short, none], menu: style }
  yokeDepth: { pct: 30, min: 20, max: 90, menu: style } # narrow yokes or neckbands
  skirtLength: { pct: 47, min: 15, max: 98, menu: style }
  gathers: { pct: 170, min: 100, max: 250, menu: style }
  placketDepth: { pct: 60, min: 10, max: 80, menu: style } # open down the back
  buttons: { count: 2, min: 1, max: 8, menu: style }
  # The strap pinafore's sash (p. 248, child of 2, chest about 21"): a waistband 16 x 2 across
  # the front, sewn over the gathers at the waist, and two sash ends 20 x 2 tied at the back
  sash: { bool: false, menu: style }
  sashBand: { pct: 76, min: 50, max: 100, of: chest, menu: style } # the front waistband's length (16/21)
  sashLength: { pct: 95, min: 50, max: 150, of: chest, menu: style } # each tie (20/21)
  sashWidth: { pct: 9.5, min: 5, max: 20, of: chest, menu: style } # cut width, folded in half (2/21)

pieces:
  waistband: { part: strip, after: [backBase, frontBase], nr: 9, label: waistband, cut: 1, fold: true, length: chest * sashBand, width: chest * sashWidth, if: sash }
  sash: { part: strip, after: [backBase, frontBase], nr: 10, label: sash, cut: 2, fold: true, length: chest * sashLength, width: chest * sashWidth, if: sash }
