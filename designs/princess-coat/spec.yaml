# Princess coat: Pivnick's fitted princess coat (How to Design Beautiful Clothes, 1949, Chapter XXII,
# Section I, pp. 274-279), on the women's peacoat (FreeSewing's Breanna): princess seams, a CB seam,
# a moderate flare in every seam from the waist down, two rows of six buttons down to the waist, a
# convertible collar sewn to the front edge, slash pockets with a band, a half belt across the back.
# None of Pivnick's figures carries a number: every default is read from the diagrams. See BRIEF.md.
extends: ../womens-peacoat/spec.yaml

about:
  id: princess-coat
  name: Princess coat
  category: coats
  description: "A long fitted coat with princess seams and a moderate flare, two rows of six buttons to the waist, a convertible collar and banded slash pockets"
  difficulty: 4
  tags: [coats]
  techniques: [princess-seam, collar, facing, button, flap-pocket, lining, two-piece-sleeve]
  version: 0.1.0
  source: "Pivnick, How to Design Beautiful Clothes (1949), Chapter XXII, pp. 274-279 (pivnickdesignclothes1949)"
  preview: cisFemaleAdult36

options:
  # Fit (p. 275): "enough larger than a dress to permit lining and wearing over dresses", "but not
  # too snug". Between the tailored jacket's and the peacoat's
  chestEase: { pct: 16 }
  waistEase: { pct: 14 }
  seatEase: { pct: 10 }
  # Length (Fig. 1 to mid-calf): Fig. 5, 345 of the 200 units from neck point to waist, on a figure
  # with about 17 1/2" there: 30" below the waist, 72% of about 41"
  lengthBelowWaist: { pct: 72, min: 25, max: 85 }
  # The flare (Figs. 5, 6): each edge about 4 1/4" past its waist point at the hem, 11% of a 40" seat.
  # "The amount of flare in the skirt may vary" (p. 275)
  hemFlare: { pct: 11, min: 0, max: 25, of: seat, menu: style, title: Flare, description: "How far each seam's edge flares out by the hem, as a share of the seat. The seat's own need sets the least it can be." }
  # The lap and rows (Fig. 5): about 2 1/4" past CF, the rows about 1 1/2" either side of it
  buttonExtension: { pct: 6, min: 3, max: 12 } # 2 1/4" of 36
  buttonRow: { pct: 62 } # x the lap: about 1 3/8" from CF
  buttons: { count: 6, min: 2, max: 8 } # to a row (Figs. 1, 3, 5)
  buttonBottom: { pct: 0, min: 0, max: 60, menu: style } # x waistToSeat: the last row on the waist (Fig. 3, C)
  # "The princess line has been shifted slightly ... to make an easier fit. The dart spaces are kept
  # the same" (Fig. 3, where it moves a little toward CF from the book's foundation). Fig. 5 ends with the
  # seam about 3 3/4" from CF at the waist, 2 1/4" past the button row. Breanna's waist dart is closer
  # in, and on men's sets reaches CF, so ours moves toward the side: at least this far past the row
  frontSeamClear: { pct: 4, min: 2, max: 8, of: chest, menu: fit, title: Front seam, description: "How far the front seam stays from the button row at the waist, as a share of the chest. It moves toward the side with the dart's width unchanged." } # about 1 1/2"
  # The convertible coat collar (Chapter XVI, Section X): "a large collar", "as wide as desired";
  # about 3 1/4" as Figs. 1 and 2 draw it. `storm` is its construction: sewn round to the front edge
  collarWidth: { pct: 24 }
  # The slash pocket's band (Fig. 5): 5 1/2" long, 2 1/2" deep, sloping 23 degrees to the side, its
  # front end 3" below the waist, nearly filling the side front
  pocketBelow: { pct: 34 } # x waistToSeat (3" of about 9")
  pocketWidth: { pct: 85 }
  pocketFromSeam: { pct: 3.5 } # x chest: the band hangs square from a sloped mouth, so its front corner needs this to stay on the panel
  pocketAngle: { deg: 23, min: 0, max: 30 }
  flapDepth: { pct: 44 }
  # The half belt across the back (Fig. 1, back view only; about 1" wide, a third of the waist)
  halfBelt: { bool: true, menu: style }
  halfBeltLength: { pct: 33, min: 20, max: 50, of: waist, menu: style }
  beltWidth: { pct: 2.8, min: 1.5, max: 6, of: chest, menu: style }

pieces:
  frontBase:
    prefix: tailoredjacket # named like the inherited pieces
    from: breanna.front
    after: [backBase]
    hide: { self: true, from: true, inherited: true }
    options: all
    measurements: [chest, seat, waistToSeat, waistToFloor, neck, hpsToWaistFront]
    ops:
      - jacketBase: { side: front }
      - jacketLayout:
          seat: seat * (1 + seatEase)
          hipDepth: waistToSeat
          length: waistToFloor * lengthBelowWaist
          hemFlare: seat * hemFlare
          cb: { waist: 0, hip: 0, flare: true }
          lap: chest * buttonExtension
          breakBelow: hpsToWaistFront * breakBelowBust
          rollOut: neck * rollOut
          lapelWidth: neck * lapelWidth
          gorgeAt: gorgeAt
          peak: lapelStyle == 'peak'
          closed: lapelStyle == 'storm'
          rows: if(doubleBreasted, chest * buttonExtension * buttonRow, null)
          buttonBottom: waistToSeat * buttonBottom
          frontSeamMin: chest * (frontSeamClear + if(doubleBreasted, buttonExtension * buttonRow, 0))
          facing: chest * facingWidth
          backFacing: chest * backFacingDepth
          lining: lining
          liningPleat: chest * liningPleat
          # Neither drawn by Pivnick, off by default, but on the menu as on the peacoat
          welts:
            breast:
              if: breastPocket
              below: hpsToWaistFront * weltBelow
              from: chest * weltFromCF
              len: chest * weltLength
              rise: weltRise
              welt: len * weltDepth
              bag: len * bagDepth
              clear: chest * 0.02
          pockets:
            hip:
              if: pockets
              below: waistToSeat * pocketBelow
              from: chest * pocketFromSeam
              share: pocketWidth
              angle: pocketAngle
              flapRatio: flapDepth
              bagRatio: bagDepth
              clear: chest * 0.015
            ticket:
              if: pockets and ticketPocket
              below: waistToSeat * (pocketBelow - ticketAbove)
              from: chest * pocketFromSeam
              share: pocketWidth * ticketWidth # of the side front's width at its own mouth
              angle: pocketAngle
              flapRatio: ticketFlapDepth
              bagRatio: bagDepth
              clear: chest * 0.015
          sleeveStore: [library.twoPartSleeve, library.topsleeve, library.undersleeve, tailoredjacket.topsleeve, tailoredjacket.undersleeve]
      - store: { key: library.topsleeve.title, value: { nr: 7, brand: "'PublicSewing'" } }
      - store: { key: library.undersleeve.title, value: { nr: 8, brand: "'PublicSewing'" } }

  # Folded in two along its length; sewn on over the back at the waist
  halfBelt:
    part: polygon
    after: frontBase
    nr: 20
    label: halfBelt
    if: halfBelt
    measurements: [chest, waist]
    options: [halfBeltLength, beltWidth, halfBelt]
    let:
      w: waist * halfBeltLength
      h: chest * beltWidth * 2
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [1, 1, 1, 1]
    cut: 1

# The same pattern with other options, shown on its page after the pattern tool
variants:
  fuller:
    name: Fuller skirt
    description: "More flare in every seam, for a fuller hem. The book says the flare can vary season to season; this amount is ours."
    options: { hemFlare: 0.18 }
  notch:
    name: Notched lapels
    description: "Lapels cut open with a notch at the collar, always worn open at the top, in place of the collar that buttons to the neck."
    options: { lapelStyle: notch, buttons: 4 }
