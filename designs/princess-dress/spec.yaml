about:
  id: princess-dress
  name: Princess dress
  category: dresses
  description: A sleeveless princess-seam dress in four continuous panels from shoulder to hem, fitted to your measurements
  difficulty: 3
  tags: [dresses]
  techniques: [princess seams, binding]
  version: 0.1.0
  source: Built on FreeSewing's Noble princess bodice block
  preview: cisFemaleAdult36

block: noble

options:
  dartPosition: { dflt: shoulder, list: [shoulder, armhole], menu: style }
  dressLength: { pct: 45, min: 30, max: 80, of: waistToFloor, menu: style }
  princessFlare: { pct: 5, min: 0, max: 15, of: seat, menu: style }
  sideFlare: { pct: 8, min: 0, max: 20, of: seat, menu: style }
  zipLength: { pct: 60, min: 30, max: 100, of: waistToSeat, menu: style }

pieces:
  backInside:
    from: noble.backInside
    hide: tree
    options: [dressLength, princessFlare, zipLength]
    measurements: [waistToFloor, waistToSeat, seat]
    ops:
      - brand: { nr: 1, title: backInside }
      - princessDress: { panel: backInside, length: waistToFloor * dressLength, princessFlare: seat * princessFlare, zip: waistToSeat * zipLength }
  backOutside:
    from: noble.backOutside
    hide: tree
    options: [dressLength, princessFlare, sideFlare]
    measurements: [waistToFloor, seat]
    ops:
      - brand: { nr: 2, title: backOutside }
      - princessDress: { panel: backOutside, length: waistToFloor * dressLength, princessFlare: seat * princessFlare, sideFlare: seat * sideFlare }
  frontInside:
    from: noble.frontInside
    hide: tree
    options: [dressLength, princessFlare]
    measurements: [waistToFloor, seat]
    ops:
      - brand: { nr: 3, title: frontInside }
      - princessDress: { panel: frontInside, length: waistToFloor * dressLength, princessFlare: seat * princessFlare }
  frontOutside:
    from: noble.frontOutside
    hide: tree
    options: [dressLength, princessFlare, sideFlare]
    measurements: [waistToFloor, seat]
    ops:
      - brand: { nr: 4, title: frontOutside }
      - princessDress: { panel: frontOutside, length: waistToFloor * dressLength, princessFlare: seat * princessFlare, sideFlare: seat * sideFlare }

variants:
  armhole:
    name: Armhole princess dress
    description: Princess seams rise from the armhole instead of the shoulder.
    options: { dartPosition: armhole }

# Piece numbers, seam codes and stitches printed on the pattern (SPEC.md "Pattern map")
patternMap:
  pieces: { backInside: 1, backOutside: 2, frontInside: 3, frontOutside: 4 }
  stitches:
    SS: { name: straight seam, key: "straight seam; finish raw edges" }
    BN: { name: binding, key: bind or face the raw edge }
    HS: { name: hem stitch, key: turn the hem and stitch it }
  codes:
    PF:
      name: front princess seam
      stitch: SS
      at: [{ part: frontInside, between: [waistDartLeft, princessHip] }, { part: frontOutside, between: [waistDartRight, princessHip] }]
    PB:
      name: back princess seam
      stitch: SS
      at: [{ part: backInside, between: [dartBottomLeft, princessHip] }, { part: backOutside, between: [dartBottomRight, princessHip] }]
    A:
      name: shoulder
      stitch: SS
      at:
        - { part: frontInside, between: [hps, shoulderDartInside] }
        - { part: backInside, between: [hps, shoulder] }
    S:
      name: side seam
      stitch: SS
      at: [{ part: frontOutside, between: [sideHem, outerHip] }, { part: backOutside, between: [waistSide, outerHip] }]
    N:
      name: neckline
      stitch: BN
      at: [{ part: frontInside, between: [hps, cfNeck] }, { part: backInside, between: [hps, cbNeck] }]
    AH:
      name: armhole
      stitch: BN
      at: [{ part: frontOutside, between: [armhole, armholePitch] }, { part: backOutside, between: [armhole, armholePitch] }]
    CB:
      name: centre back seam and zip
      stitch: SS
      at: [{ part: backInside, between: [waistCenter, outerHip] }]
    H:
      name: hem
      stitch: HS
      at:
        - { part: frontInside, between: [princessHip, outerHip] }
        - { part: frontOutside, between: [princessHip, outerHip] }
        - { part: backInside, between: [princessHip, outerHip] }
        - { part: backOutside, between: [princessHip, outerHip] }
