# Weiler's riding habit, PDF pp. 86-87: six shaped body panels a side, narrow back and extra seat room.
extends: ../double-dart-jacket/spec.yaml

about:
  id: riding-habit-coat
  name: Riding habit coat
  category: coats
  description: A long fitted riding coat with a narrow back panel, six shaped body panels per side and a full skirt for the saddle
  difficulty: 4
  tags: [coats]
  techniques: [princess-seam, shawl-collar, facing, button, lining, two-piece-sleeve]
  version: 0.1.0
  source: Weiler, The Ladies' Tailor (1915), Riding Habit Coat, PDF pp. 86-87 (weilerladiestail00weil)
  preview: cisFemaleAdult36

options:
  # The back at the waist is 1 1/4 in on a 40 in hip: 1.25 / 40.
  ridingBackWidth: { pct: 3.125, min: 2, max: 6, of: seat, menu: fit }
  # Back hip line 1 3/4 in versus 1 1/4 at the waist: 1/2 in more on 40 in seat.
  # The chosen 2.2% hem flare produces about that increase at hip depth on the reference size.
  ridingBackFlare: { pct: 2.2, min: 1, max: 7, of: seat, menu: fit }
  # "More cloth on hip line ... than for ordinary coats"; 14% versus the fitted jacket's 10% is ours.
  seatEase: { pct: 14, min: 8, max: 25 }
  # Weiler does not give length; read as around 23 in below the waist on the plate.
  lengthBelowWaist: { pct: 55, min: 35, max: 80 }
  # 2 in added from waist to top on a 36 in chest; the source narrows to 1 1/2 in below waist.
  buttonExtension: { pct: 5.6, min: 3, max: 8 }
  # The two front hem steps are 4 and 4 1/2 in; a uniform 4 in per seam edge is our adaptation.
  ridingHemFlare: { pct: 10, min: 3, max: 18, of: seat, menu: style }
  # The back has a straight CB on the plate, rather than Mitchell's 2 in CB suppression.
  cbSuppression: { pct: 0, menu: false }
  cbSeat: { pct: 0, menu: false }
  # B bisects the two 5 in positions on the waist; the extra panel from B is 2 1/2 in each side.
  secondAt: { pct: 50, min: 25, max: 75 }
  # A similar tight-fitting coat top; no pockets are shown in Weiler's plate.
  pockets: { bool: false, menu: false }
  breastPocket: { bool: false, menu: false }
  ticketPocket: { bool: false, menu: false }
  buttons: { count: 5, min: 3, max: 8 }

pieces:
  backBase:
    from: breanna.back
    hide: { self: true, from: true, inherited: true }
    options: all
    ops:
      - jacketBase: { side: back, backSeamAt: backSeamAt, backWaistWidth: seat * ridingBackWidth }
  frontBase:
    from: breanna.front
    after: [backBase]
    hide: { self: true, from: true, inherited: true }
    options: all
    measurements: [chest, seat, waistToSeat, waistToFloor, neck, hpsToWaistFront]
    let:
      d: max(0, seat * (1 + seatEase) - waist * (1 + waistEase)) / 2
      k: min(1, max(0, waist * (waistEase - 0.09) / 2) / max(1, d * (underarmSuppression + secondSuppression)))
    ops:
      - jacketBase: { side: front }
      - jacketLayout:
          seat: seat * (1 + seatEase)
          hipDepth: waistToSeat
          length: waistToFloor * lengthBelowWaist
          hemFlare: seat * ridingHemFlare
          backHemFlare: seat * ridingBackFlare
          lap: chest * buttonExtension
          breakBelow: hpsToWaistFront * breakBelowBust
          rollOut: neck * rollOut
          lapelWidth: neck * lapelWidth
          gorgeAt: 0.55
          shawl: { width: neck * collarWidth, lapel: lapelWidth }
          underarm:
            back: underarmBack
            front: underarmFront
            backSuppression: d * underarmSuppression * k
            frontSuppression: 0
          second:
            at: secondAt
            suppression: d * secondSuppression * k
          cb: { waist: 0, hip: 0 }
          facing: chest * facingWidth
          backFacing: chest * backFacingDepth
          lining: lining
          liningPleat: chest * liningPleat
          sleeveStore: [library.twoPartSleeve, library.topsleeve, library.undersleeve, riding-habit-coat.topsleeve, riding-habit-coat.undersleeve]
      - store: { key: library.topsleeve.title, value: { nr: 7, brand: "'PublicSewing'" } }
      - store: { key: library.undersleeve.title, value: { nr: 8, brand: "'PublicSewing'" } }

variants:
  fuller:
    name: Fuller riding skirt
    description: More room and sweep at the seat and hem.
    options: { seatEase: 0.2, ridingHemFlare: 0.15 }
