# Salwar, inspired by CBSE's Basic Pattern Development (2014); methods and proportions only. Cut flat
# from straight lines, no block: each leg a straight centre panel with a tapering side panel (kali) on
# each side, the top gathered into a belt with a drawstring casing. For any size. See BRIEF.md.
block: titan

about:
  id: salwar
  name: Salwar
  category: trousers
  description: "Full gathered trousers cut from straight panels, with tapering side panels, a belt with a drawstring and a narrow bottom"
  difficulty: 2
  tags: [bottoms]
  techniques: [gathering, casing, hem]
  version: 0.1.0
  source: "Central Board of Secondary Education with the National Institute of Fashion Technology, Basic Pattern Development: Students Handbook + Practical Manual, Class XII (CBSE, 2014)"
  garmentTraditions: [punjab-patternmaking]
  taken: panel layout and proportions
  preview: cisFemaleAdult30

options:
  salwarLength: { pct: 96, min: 70, max: 100, of: waistToFloor, menu: style, title: Salwar length, description: "Length from the waist to the hem, as a share of the waist to the floor." } # ours: to the ankle
  bottomWidth: { pct: 140, min: 115, max: 250, of: ankle, menu: style, title: Bottom width, description: "Round the hem, as a share of the ankle; wide enough for the foot to pass." }
  beltDepth: { pct: 19.4, min: 10, max: 30, of: seat, menu: style, title: Belt depth, description: "Depth of the belt below its casing, as a share of the seat." }
  casingDepth: { pct: 5.6, min: 3, max: 8, of: seat, menu: style, title: Casing depth, description: "Depth of the drawstring casing folded over at the top of the belt, as a share of the seat." }
  beltWidth: { pct: 27.8, min: 26, max: 40, of: seat, menu: fit, title: Belt width, description: "Half the width of each belt piece (front and back), as a share of the seat; the belt must go on over the hips." }
  kaliWidth: { pct: 50, min: 30, max: 130, of: seat, menu: style, title: Side panel width, description: "Width of each side panel (kali) at the waist, as a share of the seat; more makes a fuller salwar." }
  crotchShare: { pct: 33.3, min: 25, max: 45, menu: advanced, title: Crotch depth, description: "How far down the side panels' inner edges the crotch seam runs, as a share of the length below the belt." }
  kaliPoint: { pct: 2.1, min: 1, max: 5, of: seat, menu: advanced, title: Side panel point, description: "Width of each side panel at its narrow end, as a share of the seat." }

pieces:
  layout:
    from: titan.back
    hide: { self: true, from: true, inherited: true }
    options: all
  centrePanel:
    part: polygon
    after: layout
    nr: 1
    label: centrePanel
    cut: 2
    measurements: [waistToFloor, ankle, seat]
    let:
      g: waistToFloor * salwarLength - seat * beltDepth
      w: ankle * bottomWidth / 2
    points: [[0, 0], [w, 0], [w, g], [0, g]]
    allowance: [1, 1, 3, 0]
    fold: 3
    lines: [[[w * 0.1, 15], [w * 0.9, 15]]] # gather the top
  kali:
    part: polygon
    after: layout
    nr: 2
    label: kali
    cut: 4
    measurements: [waistToFloor, seat]
    let:
      g: waistToFloor * salwarLength - seat * beltDepth
      k: seat * kaliWidth
      m: g * crotchShare
      p: seat * kaliPoint
    points: [[0, 0], [0, m], [p, m], [k - p, g], [k, g], [k, 0]]
    allowance: [1, 1, 1, 3, 1, 1]
    notches: [[0, m]]
    lines: [[[k * 0.1, 15], [k * 0.9, 15]]] # gather the top
  belt:
    part: polygon
    after: layout
    nr: 3
    label: belt
    cut: 2
    measurements: [seat]
    let:
      w: seat * beltWidth
      a: seat * casingDepth
      h: seat * (casingDepth + beltDepth)
    points: [[0, 0], [w, 0], [w, h], [0, h]]
    allowance: [1, 1, 1, 0]
    fold: 3
    lines: [[[0, a], [w, a]]] # the casing's fold line

# The same pattern with other options, shown on its page after the pattern tool
variants:
  patiala:
    name: Patiala salwar
    description: "Much wider side panels, for a fuller salwar falling in deep folds."
    options: { kaliWidth: 0.625 }

# Piece numbers, seam codes and stitches printed on the pattern (SPEC.md "Pattern map"). Corners:
# centre panel v0 top left, v1 top right, v2 hem right, v3 hem at the fold; kali (side panel) v0
# top inner, v1 crotch notch, v2 inseam top, v3 and v4 the hem, v5 top outer
patternMap:
  pieces: { centrePanel: 1, kali: 2, belt: 3 }
  stitches:
    SS: { name: straight seam, key: "straight seam; finish raw edges" }
    GS: { name: gathering, key: "two rows of long stitches, drawn up to fit" }
    CS: { name: casing, key: turn the casing and stitch it; thread a drawstring or elastic }
    HS: { name: hem stitch, key: turn the hem and stitch it }
  codes:
    K:
      name: side panel to centre panel, straight edge to straight edge
      stitch: SS
      at: [{ part: centrePanel, between: [v1, v2] }, { part: kali, between: [v4, v5] }]
    X:
      name: crotch seam, front panels then back
      stitch: SS
      at: [{ part: kali, between: [v0, v1] }]
    I:
      name: inseam
      stitch: SS
      at: [{ part: kali, between: [v2, v3] }]
    B:
      name: belt side seams
      stitch: SS
      at: [{ part: belt, between: [v1, v2] }]
    W:
      name: legs gathered into the belt
      stitch: GS
      at: [{ part: centrePanel, between: [v0, v1] }, { part: kali, between: [v5, v0] }, { part: belt, between: [v2, v3] }]
    CS:
      name: casing
      stitch: CS
      kind: placement
      at: [{ part: belt, path: mark0, along: 0.5 }]
    H:
      name: hems
      stitch: HS
      at: [{ part: centrePanel, between: [v2, v3] }, { part: kali, between: [v3, v4] }]
