# Sewing order for the independently written numbered steps in BRIEF.md.
# P and P8 mark this design's patch-pocket paths in spec.yaml's patternMap.
design: scout-coat
steps:
  - { order: 1, action: prepare upper pockets and flaps, placements: [P8], stitches: [TS], whenAny: [breastPockets] }
  - { order: 2, action: prepare lower pockets and flaps, placements: [P], stitches: [TS], whenAny: [lowerPockets] }
  - { order: 3, action: join body and shoulders, seams: [C, B, A], stitches: [SS] }
  - { order: 4, action: attach collar and facings, seams: [E, F], stitches: [SS] }
  - { order: 5, action: join and set sleeves and finish hems, seams: [G, H, D, J], stitches: [SS, HS] }
  - { order: 6, action: work front buttonholes and attach buttons, placements: [BH], stitches: [BH] }
