# References for the independently written steps in BRIEF.md's Construction section.
# Codes and piece numbers are defined once in spec.yaml (patternMap); this file names their sewing order.
design: shop-coat
steps:
  - { order: 1, action: interface facings and collar, pieces: [5, 4] }
  - { order: 2, action: prepare and attach pockets, pieces: [6, 7, 8, 1], placements: [P6, P7, P8], stitches: [TS], whenAny: [breastPocket, lowerPockets, pencilPocket] }
  - { order: 3, action: join shoulders, pieces: [1, 2], seams: [A], stitches: [FF] }
  - { order: 4, action: make and set collar, pieces: [4, 1, 2], seams: [G, D], stitches: [SS] }
  - { order: 5, action: apply facings, pieces: [5, 1], seams: [E], stitches: [SS] }
  - { order: 6, action: set and close sleeves and sides, pieces: [3, 1, 2], seams: [C, F, B], stitches: [SS, FF] }
  - { order: 7, action: turn and topstitch hems, pieces: [1, 2, 3], seams: [H], stitches: [TS] }
  - { order: 8, action: work buttonholes and attach buttons, pieces: [1], placements: [BH], stitches: [BH] }
