# Sewing order for the independently written numbered steps in BRIEF.md.
# Codes are defined in the inherited patternMap in spec.yaml.
design: shorts
steps:
  - { order: 1, action: sew darts and selected pockets, seams: [M], placements: [SP, BP], stitches: [SS] }
  - { order: 2, action: join legs and close fly and crotch, seams: [O, I, X], placements: [Z], stitches: [SS, TS] }
  - { order: 3, action: finish separate or cut-on waistband, seams: [W], stitches: [SS] }
  - { order: 4, action: hem short legs, seams: [H], stitches: [HS] }
