# Sewing order for the independently written numbered steps in BRIEF.md.
# Codes are defined in the inherited patternMap in spec.yaml.
design: surtout
steps:
  - { order: 1, action: make variant lower body pockets, placements: [P], stitches: [SS], whenAny: [lowerPockets] }
  - { order: 2, action: make breast welt pockets, placements: [P8], stitches: [SS], whenAny: [breastPockets] }
  - { order: 3, action: make skirt pockets and flaps, whenAny: [skirtPockets] }
  - { order: 4, action: join body and skirt, seams: [C, B], stitches: [SS] }
  - { order: 5, action: join shoulders and attach collar and facings, seams: [A, E, F], stitches: [SS] }
  - { order: 6, action: join and set sleeves, seams: [G, H, D], stitches: [SS] }
  - { order: 7, action: make and attach lining }
  - { order: 8, action: finish hems and front fastening, seams: [J], placements: [BH], stitches: [HS, BH] }
