# Template for yoke garments (lib/yoke.mjs, Walker 1909): a yoke (or a bodice to the waist) at
# the top; a body (or skirt) gathered into it; an opening at the back or front with a placket;
# sleeves long or short gathered into a band, or none; a neck binding or band.
# A design extends it with its own `about` and the option defaults it changes (yokeOptions in
# lib/yoke.mjs lists them all; a design's entry replaces the whole option). A bodice-and-skirt
# design replaces the four body/yoke pieces to name them so.
block: brian

pieces:
  # Brian's back and front, drafted into the store (`yoke.*`) and hidden
  backBase:
    from: brian.back
    hide: { self: true, from: true, inherited: true }
    options: all
    ops:
      - yokeSide: { side: back }
  frontBase:
    from: brian.front
    hide: { self: true, from: true, inherited: true }
    options: all
    ops:
      - yokeSide: { side: front }
  frontBody: { part: yokePiece, after: [backBase, frontBase], side: front, piece: body, nr: 1, label: frontBody, cut: 1 }
  backBody: { part: yokePiece, after: [backBase, frontBase], side: back, piece: body, nr: 2, label: backBody, cut: 1 }
  frontYoke: { part: yokePiece, after: [backBase, frontBase], side: front, piece: yoke, nr: 3, label: frontYoke, cut: 2 }
  backYoke: { part: yokePiece, after: [backBase, frontBase], side: back, piece: yoke, nr: 4, label: backYoke, cut: 2 }
  sleeve: { part: yokeSleeve, after: [backBase, frontBase], nr: 5 }
  sleeveBand: { part: sleeveBand, after: sleeve, nr: 6 }
  placket: { part: placket, after: [backBase, frontBase], nr: 7 }
  neckBand: { part: neckBand, after: [backBase, frontBase], nr: 8 }

# The pattern map every yoke garment inherits (SPEC.md, "Pattern map"). Anchors are optional where
# a garment cuts its body with or without a yoke, a placket or a band; a design may add to it.
patternMap:
  pieces: { frontBody: 1, backBody: 2, frontYoke: 3, backYoke: 4, sleeve: 5, sleeveBand: 6, placket: 7, neckBand: 8 }
  stitches:
    SS: { name: straight seam, key: "straight seam; fell or finish the allowances" }
    TS: { name: topstitch, key: topstitch beside the seam or turned edge }
  codes:
    A:
      name: shoulder
      stitch: SS
      at:
        - { part: frontBody, between: [hps, shoulder], optional: true }
        - { part: backBody, between: [hps, shoulder], optional: true }
        - { part: frontYoke, between: [hps, shoulder], optional: true }
        - { part: backYoke, between: [hps, shoulder], optional: true }
    Y:
      name: yoke seam, body gathered or pleated to the yoke
      stitch: TS
      at:
        - { part: frontBody, between: [topFold, yokeSide], optional: true }
        - { part: backBody, between: [topFold, yokeSide], optional: true }
        - { part: frontYoke, between: [seamFold, seamArm], optional: true }
        - { part: backYoke, between: [seamFold, seamArm], optional: true }
    B:
      name: side seam
      stitch: SS
      at: [{ part: frontBody, between: [sideTop, hemSide] }, { part: backBody, between: [sideTop, hemSide] }]
    C:
      name: armhole and sleeve cap
      stitch: SS
      at:
        - { part: frontBody, between: [shoulder, sideTop], optional: true }
        - { part: frontBody, between: [yokeSide, sideTop], optional: true }
        - { part: backBody, between: [shoulder, sideTop], optional: true }
        - { part: backBody, between: [yokeSide, sideTop], optional: true }
        - { part: frontYoke, between: [shoulder, seamArm], optional: true }
        - { part: backYoke, between: [shoulder, seamArm], optional: true }
        - { part: sleeve, path: sleevecap, along: 0.5, optional: true }
    D:
      name: neckline and band
      stitch: SS
      at:
        - { part: frontBody, between: [hps, neckFold], optional: true }
        - { part: backBody, between: [hps, neckFold], optional: true }
        - { part: frontYoke, between: [hps, neckFold], optional: true }
        - { part: backYoke, between: [hps, neckFold], optional: true }
        - { part: neckBand, path: neck, along: 0.5, optional: true }
    F:
      name: sleeve underarm
      stitch: SS
      at: [{ part: sleeve, between: [bicepsLeft, wristLeft], optional: true }, { part: sleeve, between: [bicepsRight, wristRight], optional: true }]
    H:
      name: hem
      stitch: TS
      at: [{ part: frontBody, between: [hemFold, hemSide] }, { part: backBody, between: [hemFold, hemSide] }]
    W:
      name: sleeve hem or band
      stitch: SS
      at: [{ part: sleeve, path: hemBase, along: 0.5, optional: true }, { part: sleeveBand, between: [underarm, overarm], optional: true }]
    Z:
      name: front or back opening and placket
      stitch: TS
      kind: closure
      at: [{ part: frontBody, path: slit, along: 0.5, optional: true }, { part: backBody, path: slit, along: 0.5, optional: true }]
