# Tiered skirt, inspired by Joseph-Armstrong (Patternmaking for Fashion Design, 5th ed., 2010); methods
# and proportions only: four straight gathered tiers, each wider and a
# little deeper than the one above, the first gathered into a waistband with a placket at the left
# side seam. FreeSewing's Sarah only supplies the measurements. See BRIEF.md.
block: sarah

about:
  id: tiered-skirt
  name: Tiered skirt
  category: skirts
  description: A skirt of four gathered tiers, each wider than the one above, on a waistband with a side placket
  difficulty: 1
  tags: [bottoms]
  techniques: [gathering, placket, waistband, hem]
  version: 0.1.0
  source: Helen Joseph-Armstrong, Patternmaking for Fashion Design, 5th ed. (Pearson, 2010)
  taken: tier proportions # the design page: "its tier proportions follow" the book
  preview: cisFemaleAdult36

options:
  skirtLength: { pct: 72.5, min: 40, max: 95, of: waistToFloor, menu: style } # a little below the knee
  firstTier: { pct: 150, min: 110, max: 220, menu: style } # x waist, gathered in
  tierFullness: { pct: 200, min: 130, max: 250, menu: style } # each tier's width x the one above
  tierGrowth: { pct: 112, min: 100, max: 140, menu: style } # each tier's depth x the one above
  backWaistDrop: { pct: 5, min: 0, max: 10, menu: fit } # x waist to seat: the back waist lowered at CB
  placketLength: { pct: 90, min: 50, max: 120, menu: style } # x waist to seat, down the left side seam, into the second tier if it's deeper than the first (never past it)
  waistbandHeight: { pct: 3, min: 2, max: 6, of: waistToFloor, menu: style } # finished

pieces:
  # Sarah's base, only for the measurements
  base:
    from: sarah.base
    hide: tree
    options: all
    ops:
      - hidePiece: {}
  # Tier 1, front and back: each a quarter of the tier's width, on the fold. The back's waist is
  # lowered at CB, blending straight to the side seam
  front:
    part: polygon
    after: base
    nr: 1
    fold: 3
    let:
      a: max(waist * firstTier, seat * 1.05) / 4 # never narrower than the hips
      t: waistToFloor * skirtLength / (1 + tierGrowth + tierGrowth * tierGrowth + tierGrowth * tierGrowth * tierGrowth)
      pl: min(waistToSeat * placketLength, t * (1 + tierGrowth) - 15) # the placket, ending in this tier or the next
      py: if(pl <= t - 15, pl, null)
    points: [[0, 0], [a, 0], [a, t], [0, t]]
    allowance: [1, 1, 1, 0]
    notches: [[a, py]]
    lines: [[[a * 0.05, 8], [a * 0.95, 8]]]
  back:
    part: polygon
    after: base
    nr: 2
    fold: 3
    let:
      a: max(waist * firstTier, seat * 1.05) / 4
      t: waistToFloor * skirtLength / (1 + tierGrowth + tierGrowth * tierGrowth + tierGrowth * tierGrowth * tierGrowth)
      d: waistToSeat * backWaistDrop
      pl: min(waistToSeat * placketLength, t * (1 + tierGrowth) - 15)
      py: if(pl <= t - 15, pl, null)
    points: [[0, d], [a, 0], [a, t], [0, t]]
    allowance: [1, 1, 1, 0]
    notches: [[a, py]]
    lines: [[[a * 0.05, 8 + d * 0.95], [a * 0.95, 8 + d * 0.05]]]
  # Tiers 2 to 4: a quarter of each, on the fold, cut twice (front and back). Join fabric widths
  # across as needed; gather the top onto the tier above
  tier2:
    part: polygon
    after: base
    nr: 3
    fold: 3
    cut: 2
    let:
      a: max(waist * firstTier, seat * 1.05) / 4 * tierFullness
      t: waistToFloor * skirtLength / (1 + tierGrowth + tierGrowth * tierGrowth + tierGrowth * tierGrowth * tierGrowth) * tierGrowth
      t1: t / tierGrowth
      pl: min(waistToSeat * placketLength, t1 + t - 15)
      py: if(pl <= t1 - 15, null, max(pl - t1, 15)) # a placket deeper than the first tier ends here, on the left side
    points: [[0, 0], [a, 0], [a, t], [0, t]]
    allowance: [1, 1, 1, 0]
    notches: [[a, py]]
    lines: [[[a * 0.05, 8], [a * 0.95, 8]]]
  tier3:
    part: polygon
    after: base
    nr: 4
    fold: 3
    cut: 2
    let:
      a: max(waist * firstTier, seat * 1.05) / 4 * tierFullness * tierFullness
      t: waistToFloor * skirtLength / (1 + tierGrowth + tierGrowth * tierGrowth + tierGrowth * tierGrowth * tierGrowth) * tierGrowth * tierGrowth
    points: [[0, 0], [a, 0], [a, t], [0, t]]
    allowance: [1, 1, 1, 0]
    lines: [[[a * 0.05, 8], [a * 0.95, 8]]]
  tier4:
    part: polygon
    after: base
    nr: 5
    fold: 3
    cut: 2
    let:
      a: max(waist * firstTier, seat * 1.05) / 4 * tierFullness * tierFullness * tierFullness
      t: waistToFloor * skirtLength / (1 + tierGrowth + tierGrowth * tierGrowth + tierGrowth * tierGrowth * tierGrowth) * tierGrowth * tierGrowth * tierGrowth
    points: [[0, 0], [a, 0], [a, t], [0, t]]
    allowance: [1, 1, 4, 0]
    lines: [[[a * 0.05, 8], [a * 0.95, 8]]]
  # The waist plus an underlap at the placket, folded
  waistband:
    part: strip
    after: base
    nr: 6
    fold: true
    length: waist + waistToFloor * waistbandHeight
    width: waistToFloor * waistbandHeight
  placketStrip:
    part: strip
    after: base
    nr: 7
    length: 2 * min(waistToSeat * placketLength, waistToFloor * skirtLength / (1 + tierGrowth + tierGrowth * tierGrowth + tierGrowth * tierGrowth * tierGrowth) * (1 + tierGrowth) - 15) + 20
    width: 50
