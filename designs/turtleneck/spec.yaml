# A turtleneck: Bibi's knit top at its crew neckline with a tall rib collar,
# cut as a tube from the neck opening, folded in half and turned down when worn. Our own design,
# with no book behind it; see BRIEF.md.
about:
  id: turtleneck
  name: Turtleneck
  category: tops
  description: A close-fitting knit top with a tall folded collar, long sleeves and plain or ribbed cuffs and hem, drafted from your measurements
  difficulty: 2
  tags: [tops, knits]
  techniques: [knit, set-in-sleeve, ribbing]
  version: 0.1.0
  source: Our own design, on FreeSewing's Bibi knit block

block: bibi

options:
  # Bibi's own neckline options, at Bibi's crew neck: any closer and the collar comes out shorter than
  # the neck and too tight to pass over the head (BRIEF.md), so they only open it further
  necklineWidth: { pct: 15, min: 15, max: 40, menu: style }
  necklineDepth: { pct: 25, min: 25, max: 50, menu: style }
  sleeveLength: { pct: 100, min: -20, max: 110, menu: style.sleeves } # to the wrist
  # The collar: its finished height (it's cut twice this and folded), and how much shorter than the
  # neck opening it's cut, so it hugs the neck
  collarHeight: { pct: 30, min: 8, max: 45, of: neck, menu: style, description: 'Finished height of the folded collar, as a share of the neck. About 30% turns down; 10-15% is a mock neck.' } # a turned-down turtleneck; 10-15% is a mock neck
  collarStretch: { pct: 10, min: 0, max: 25, menu: fit }

pieces:
  back:
    from: bibi.back
    options: [necklineWidth, necklineDepth]
    ops:
      - brand: { nr: 2, title: back }
    hide: tree
  front:
    from: bibi.front
    options: [necklineWidth, necklineDepth]
    ops:
      - brand: { nr: 1, title: front }
    hide: tree
  sleeve:
    from: bibi.sleeve
    options: [sleeveLength]
    ops:
      - brand: { nr: 3, title: sleeve }
    hide: tree
    if: sleeves
  cuff:
    from: bibi.cuff
    ops:
      - brand: { nr: 5, title: cuff }
    hide: tree
    if: sleeves and useCuffRibbing
  hemBand:
    from: bibi.waistband
    ops:
      - brand: { nr: 6, title: hemBand }
    hide: tree
    if: useWaistRibbing
  # Bibi's neck binding, drafted (Bibi's back and front read its height) but not cut: the collar
  # replaces it
  neckBinding:
    from: bibi.neckBinding
    hide: tree
    if: false
  collar:
    part: rib
    after: [back, front]
    options: [collarHeight, collarStretch]
    measurements: [neck]
    edge: 2 * (block.neckSizeBack + block.neckSizeFront)
    stretch: collarStretch
    height: neck * collarHeight
    round: true
    nr: 4
    label: collar

variants:
  mockNeck:
    name: Mock neck
    description: A short collar, about a third the height, standing up round the neck without folding down.
    options: { collarHeight: 0.12 }
