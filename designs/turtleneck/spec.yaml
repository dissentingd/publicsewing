# A turtleneck: Bibi's knit top at its crew neckline with a tall rib collar,
# cut as a tube from the neck opening, folded in half and turned down when worn. Our own design,
# with no book behind it; see BRIEF.md.
about:
  id: turtleneck
  name: Turtleneck
  category: tops
  description: A close-fitting knit top with a tall folded collar, long sleeves and plain or ribbed cuffs and hem, drafted from your measurements
  difficulty: 2
  tags: [tops, knits]
  techniques: [knit, set-in-sleeve, ribbing]
  version: 0.1.0
  source: Built on FreeSewing's Bibi knit block

block: bibi

options:
  # Bibi's own neckline options, at Bibi's crew neck: any closer and the collar comes out shorter than
  # the neck and too tight to pass over the head (BRIEF.md), so they only open it further
  necklineWidth: { pct: 15, min: 15, max: 40, menu: style }
  necklineDepth: { pct: 25, min: 25, max: 50, menu: style }
  sleeveLength: { pct: 100, min: -20, max: 110, menu: style.sleeves } # to the wrist
  # The collar: its finished height (it's cut twice this and folded), and how much shorter than the
  # neck opening it's cut, so it hugs the neck
  collarHeight: { pct: 30, min: 8, max: 45, of: neck, menu: style, description: 'Finished height of the folded collar, as a share of the neck. About 30% turns down; 10-15% is a mock neck.' } # a turned-down turtleneck; 10-15% is a mock neck
  collarStretch: { pct: 10, min: 0, max: 25, menu: fit }

pieces:
  back:
    from: bibi.back
    options: [necklineWidth, necklineDepth]
    ops:
      - brand: { nr: 2, title: back }
      - outline: {} # one seam outline from its edges, for exports and the pattern map
    hide: tree
  front:
    from: bibi.front
    options: [necklineWidth, necklineDepth]
    ops:
      - brand: { nr: 1, title: front }
      - outline: {} # one seam outline from its edges, for exports and the pattern map
    hide: tree
  sleeve:
    from: bibi.sleeve
    options: [sleeveLength]
    ops:
      - brand: { nr: 3, title: sleeve }
    hide: tree
    if: sleeves
  cuff:
    from: bibi.cuff
    ops:
      - brand: { nr: 5, title: cuff }
    hide: tree
    if: sleeves and useCuffRibbing
  hemBand:
    from: bibi.waistband
    ops:
      - brand: { nr: 6, title: hemBand }
    hide: tree
    if: useWaistRibbing
  # Bibi's neck binding, drafted (Bibi's back and front read its height) but not cut: the collar
  # replaces it
  neckBinding:
    from: bibi.neckBinding
    hide: tree
    if: false
  collar:
    part: rib
    after: [back, front]
    options: [collarHeight, collarStretch]
    measurements: [neck]
    edge: 2 * (block.neckSizeBack + block.neckSizeFront)
    stretch: collarStretch
    height: neck * collarHeight
    round: true
    nr: 4
    label: collar

variants:
  mockNeck:
    name: Mock neck
    description: A short collar, about a third the height, standing up round the neck without folding down.
    options: { collarHeight: 0.12 }

# Piece numbers, seam codes and stitches printed on the pattern (SPEC.md "Pattern map")
patternMap:
  pieces: { front: 1, back: 2, sleeve: 3, collar: 4, cuff: 5, hemBand: 6 }
  stitches:
    OS: { name: stretch seam, key: "stretch stitch or overlocker" }
    RB: { name: rib seam, key: "stretch the band to fit between the notches; stretch stitch or overlocker" }
    HS: { name: hem stitch, key: "turn the hem; twin needle or coverstitch" }
  codes:
    A:
      name: shoulder
      stitch: OS
      at: [{ part: front, between: [hps, shoulder] }, { part: back, between: [hps, shoulder] }]
    C:
      name: sleeve cap, set in flat
      stitch: OS
      at:
        - { part: front, path: armhole, along: 0.4 }
        - { part: back, path: armhole, along: 0.4 }
        - { part: sleeve, path: sleevecap, along: 0.5, optional: true }
    S:
      name: side and sleeve seam, in one
      stitch: OS
      at:
        - { part: front, between: [armhole, hem] }
        - { part: back, between: [armhole, hem] }
        - { part: sleeve, between: [bicepsLeft, wristLeft], optional: true }
    H:
      name: hems, or where a cuff or hem band is sewn on
      stitch: HS
      at:
        - { part: front, between: [cfHem, hem], optional: true }
        - { part: back, between: [cbHem, hem], optional: true }
        - { part: sleeve, between: [wristLeft, wristRight], optional: true }
    R:
      name: cuffs and hem band, joined into rings and sewn on
      stitch: RB
      at:
        - { part: cuff, between: [topLeft, bottomLeft], optional: true }
        - { part: hemBand, between: [topLeft, bottomLeft], optional: true }
    K:
      name: collar ends, joined into a ring
      stitch: OS
      at: [{ part: collar, between: [v1, v2] }]
    N:
      name: collar to neckline, at the quarter notches
      stitch: RB
      at:
        - { part: collar, between: [v2, v3] }
        - { part: front, between: [hps, cfNeck] }
        - { part: back, between: [hps, cbNeck] }
