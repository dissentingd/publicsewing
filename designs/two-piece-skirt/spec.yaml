# Two-piece skirt: Mitchell 1921's "Two-Piece Skirt" (p. 86, Diagram p. 87) on FreeSewing's Sarah
# through the gored skirt: "a plain two-piece skirt, drafted to fit tight at the hips and waist
# line", a front on the fold and a back with a CB seam and zip, the waist shaped at the side
# seams and CB, the side seams running straight from the hem through the hip. See BRIEF.md.
extends: ../gored-skirt/spec.yaml

about:
  id: two-piece-skirt
  name: Two-piece skirt
  category: skirts
  description: A plain skirt fitted at the hips and waist, shaped in its side seams, with a CB zip and a waistband
  difficulty: 2
  tags: [bottoms]
  techniques: [zip, waistband, hem]
  version: 0.1.0
  source: Mitchell, Ladies' Tailor-Made Garments (1921), Two-Piece Skirt, pp. 86-87 (mitchell)
  preview: cisFemaleAdult36

options:
  gores: { dflt: 3, list: [3], menu: false } # the front and the back (with its CB seam)
  panelShare: { pct: 45, min: 40, max: 60, menu: style } # x the half hip: 11 from 4 (the CF side) is 1/2 of 4-7 less 1 in, 9 of 20
  goreFlare: { pct: 20, min: 0, max: 80, menu: style } # the side seam straight from the hem (12) through the hip (11)
  cbShaping: { pct: 21, min: 0, max: 50, menu: advanced } # the foundation's CB shaping
  panelShaping: { pct: 79, min: 50, max: 100, menu: advanced } # the rest at the side seam (13, 14)
  # The high-waisted skirt (p. 88): CF and CB run on above the waist, "2 inches ... or the amount
  # desired", the side seam's dart reshaped, adding 1/2 or 3/4 in to each part at the waist; finished
  # without a band. Off by default; the `high-waisted` variant
  highWaist: { bool: false, menu: style }
  riseHeight: { pct: 29, min: 10, max: 60, menu: style } # x waistToSeat: 2 in of 7
  riseEase: { pct: 1.56, min: 0, max: 3, of: seat, menu: fit } # 5/8 in of 40, on each part at each side seam
  riseFlare: { pct: 10, min: 0, max: 30, menu: advanced } # the side edges open out above the waist: 3/16 in over 2 in, read from p. 89

pieces:
  layout:
    from: sarah.base
    hide: tree
    options: all
    ops:
      - skirtLayout:
          gores: gores
          panelNarrowing: 0
          panelShare: panelShare
          cbShaping: cbShaping
          panelShaping: panelShaping
          flare: goreFlare
          frontDrop: waistToSeat * frontWaistDrop
          riseHeight: if(highWaist, waistToSeat * riseHeight, 0)
          riseAdd: seat * riseEase
          riseFlare: riseFlare
  # The high waist has a facing where the plain skirt has a band
  waistband:
    prefix: gored-skirt
    part: strip
    after: layout
    nr: 9
    fold: true
    if: not highWaist
    length: skirt.waist + waistToFloor * waistbandHeight
    width: waistToFloor * waistbandHeight
  frontFacing: { part: goreFacing, index: 0, after: layout, nr: 10, label: frontFacing, if: highWaist }
  backFacing: { part: goreFacing, index: 1, after: layout, nr: 11, label: backFacing, if: highWaist }

# The same pattern with other options, shown on its page after the pattern tool
variants:
  high-waisted:
    name: High-waisted
    description: "Mitchell's two-piece high-waisted skirt: the skirt runs on about 2 in above the waist and is finished with a facing, in place of the band."
    options: { highWaist: true }
