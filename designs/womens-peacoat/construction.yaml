# Sewing order for the independently written numbered steps in BRIEF.md.
# Codes are defined in the inherited patternMap in spec.yaml.
design: womens-peacoat
steps:
  - { order: 1, action: make hip pockets, placements: [P14], stitches: [SS], whenAny: [pockets] }
  - { order: 2, action: make variant breast welt pocket, placements: [P12], stitches: [SS], whenAny: [breastPocket] }
  - { order: 3, action: make variant ticket welt pocket, placements: [P17], stitches: [SS], whenAny: [ticketPocket] }
  - { order: 4, action: join princess shoulder and side seams, seams: [PF, PB, A, B], stitches: [SS] }
  - { order: 5, action: attach collar and facings, seams: [D, E], stitches: [SS] }
  - { order: 6, action: join and set sleeves, seams: [F, G, C], stitches: [SS] }
  - { order: 7, action: attach lining and finish hems, seams: [H], stitches: [HS] }
  - { order: 8, action: work buttonholes and attach buttons, placements: [BH], stitches: [BH] }
