about:
  id: wrap-dress
  name: Wrap dress
  category: dresses
  description: A darted surplice dress with two crossing fronts, an A-line skirt and waist ties, drafted to your measurements
  difficulty: 3
  tags: [dresses]
  techniques: [darts, ties]
  version: 0.1.0
  source: Built on FreeSewing's Bella bodice block
  preview: cisFemaleAdult36

block: bella

options:
  neckShape: { dflt: v, list: [v], menu: style }
  skirtStyle: { dflt: aline, list: [aline], menu: style }
  neckWiden: { pct: 5, min: 0, max: 12, of: neck, menu: style }
  backNeckDepth: { pct: 5, min: 0, max: 25, of: hpsToWaistBack, menu: style }
  wrapOverlap: { pct: 25, min: 15, max: 40, of: waist, menu: style }
  sleeves: { bool: true, menu: style }
  skirtLength: { pct: 50, min: 30, max: 80, of: waistToFloor, menu: style }
  seatEase: { pct: 6, min: 0, max: 15, menu: fit }
  hemFlare: { pct: 8, min: 0, max: 20, of: seat, menu: style }
  tieLength: { pct: 120, min: 75, max: 200, of: waist, menu: style }
  tieWidth: { pct: 3, min: 2, max: 6, of: waistToSeat, menu: style, description: 'Cut width of each tie as a share of waist to seat.' }

pieces:
  back:
    from: bella.back
    hide: tree
    options: [neckWiden, backNeckDepth]
    measurements: [neck, hpsToWaistBack]
    ops:
      - brand: { nr: 2, title: back }
      - bodiceNeck: { which: back, widen: neck * neckWiden, depth: hpsToWaistBack * backNeckDepth }
      - bodiceWaist: { which: back }
      - cutlist: { cut: 2, from: fabric, onFold: false }
  front:
    from: bella.front
    hide: tree
    options: [neckShape, neckWiden, wrapOverlap]
    measurements: [neck, waist, hpsToWaistFront]
    ops:
      - brand: { nr: 1, title: front }
      - bodiceNeck: { which: front, widen: neck * neckWiden, style: neckShape, depth: hpsToWaistFront * 0.45 }
      - wrapFront: { overlap: waist * wrapOverlap }
      - bodiceWaist: { which: front, overlap: waist * wrapOverlap }
  sleeve:
    from: bella.sleeve
    hide: tree
    if: sleeves
    options: [sleeves]
    ops:
      - brand: { nr: 6, title: sleeve }
  skirtFront:
    part: dressSkirt
    which: front
    after: [front]
    nr: 3
    label: skirtFront
    options: [skirtStyle, skirtLength, seatEase, hemFlare, wrapOverlap]
    measurements: [seat, waist, waistToSeat, waistToFloor]
    style: skirtStyle
    gathers: 1
    seat: seat
    waistToSeat: waistToSeat
    seatEase: seatEase
    flare: seat * hemFlare
    length: waistToFloor * skirtLength
    wrap: waist * wrapOverlap
    dartDepth: 0.55
  skirtBack:
    part: dressSkirt
    which: back
    after: [back]
    nr: 4
    label: skirtBack
    options: [skirtStyle, skirtLength, seatEase, hemFlare]
    measurements: [seat, waistToSeat, waistToFloor]
    style: skirtStyle
    gathers: 1
    seat: seat
    waistToSeat: waistToSeat
    seatEase: seatEase
    flare: seat * hemFlare
    length: waistToFloor * skirtLength
    dartDepth: 0.7
  tie:
    part: polygon
    nr: 5
    label: tie
    options: [tieLength, tieWidth]
    measurements: [waist, waistToSeat]
    points: [[0, 0], [waist * tieLength, 0], [waist * tieLength, waistToSeat * tieWidth], [0, waistToSeat * tieWidth]]
    allowance: [1, 1, 1, 1]
    cut: 2

variants:
  sleeveless:
    name: Sleeveless wrap dress
    description: The same surplice dress with bound armholes.
    options: { sleeves: false }

# Piece numbers, seam codes and stitches printed on the pattern (SPEC.md "Pattern map")
patternMap:
  pieces: { front: 1, back: 2, skirtFront: 3, skirtBack: 4, tie: 5, sleeve: 6 }
  stitches:
    SS: { name: straight seam, key: "straight seam; finish raw edges" }
    BN: { name: binding, key: bind or face the raw edge }
    HS: { name: hem stitch, key: turn the hem and stitch it }
  codes:
    BD:
      name: bust dart
      stitch: SS
      kind: dart
      at: [{ part: front, point: bustDartTip }]
    WD:
      name: bodice waist darts
      stitch: SS
      kind: dart
      at: [{ part: front, point: waistDartLeftMid }, { part: back, point: dartTip }]
    SD:
      name: skirt darts
      stitch: SS
      kind: dart
      at: [{ part: skirtFront, point: dartTip, optional: true }, { part: skirtBack, point: dartTip, optional: true }]
    A:
      name: shoulder
      stitch: SS
      at: [{ part: front, between: [hps, shoulder] }, { part: back, between: [hps, shoulder] }]
    N:
      name: front diagonal and back neckline
      stitch: BN
      at: [{ part: front, between: [neckPoint, wrapTip] }, { part: back, between: [neckPoint, neckCb] }]
    W:
      name: waist seam, bodice to skirt
      stitch: SS
      at:
        - { part: front, between: [wrapTip, sideHem] }
        - { part: back, between: [cbWaist, waistSide] }
        - { part: skirtFront, between: [cfWaist, sideWaist] }
        - { part: skirtBack, between: [cfWaist, sideWaist] }
    CB:
      name: centre back seam
      stitch: SS
      at: [{ part: back, between: [cbNeck, cbWaist] }, { part: skirtBack, between: [cfWaist, cfHem] }]
    S:
      name: side seams, with the tie opening at the waist
      stitch: SS
      at:
        - { part: front, between: [armhole, sideHem] }
        - { part: back, between: [armhole, waistSide] }
        - { part: skirtFront, between: [sideWaist, sideHem] }
        - { part: skirtBack, between: [sideWaist, sideHem] }
    T:
      name: tie, to the front waist tip
      stitch: SS
      at: [{ part: tie, between: [v0, v3] }, { part: front, point: wrapTip }]
    C:
      name: armhole; set in the sleeve, or bind it
      stitch: SS
      at:
        - { part: front, path: armhole, along: 0.3 }
        - { part: back, path: armhole, along: 0.3 }
        - { part: sleeve, path: sleevecap, along: 0.5, optional: true }
    F:
      name: sleeve seam
      stitch: SS
      at: [{ part: sleeve, between: [bicepsLeft, wristLeft], optional: true }]
    H:
      name: hems and the skirt's front edge
      stitch: HS
      at:
        - { part: skirtFront, between: [sideHem, cfHem] }
        - { part: skirtFront, between: [cfWaist, cfHem] }
        - { part: skirtBack, between: [sideHem, cfHem] }
        - { part: sleeve, between: [wristLeft, wristRight], optional: true }
