# Yoke skirt: Aldrich's yoked skirt with gores (Metric Pattern Cutting for Women's Wear, 6th ed.,
# 2015, "Waistline adaptations: yokes", 5), used for its construction and proportions only. On
# FreeSewing's Sarah, itself drafted after Aldrich's skirt block: the waist darts carried to a yoke
# line and closed in the front and back yokes, four gores a side below, each edge flared from
# halfway down, a left side zip and a waistband. See BRIEF.md.
block: sarah

about:
  id: yoke-skirt
  name: Yoke skirt
  category: skirts
  description: A long skirt of eight flared gores below a smooth hip yoke, the waist darts closed in the yoke, with a side zip and a waistband
  difficulty: 2
  tags: [bottoms]
  techniques: [zip, waistband, hem]
  version: 0.1.0
  source: Aldrich, Metric Pattern Cutting for Women's Wear (2015), yoked skirt with gores, book p. 41 (aldrichwomenswear2015)
  preview: cisFemaleAdult36

options:
  hipYokeDepth: { pct: 65, min: 35, max: 90, menu: style } # x waist to seat: the yoke line, at the shaped yoke's middle depth
  goreEdgeFlare: { pct: 7.5, min: 0, max: 20, of: seat, menu: style } # each gore edge at the hem: 7 cm on a 94 cm hip
  flareFrom: { pct: 50, min: 25, max: 80, menu: style } # x the length: the balance points halfway down
  zipLength: { pct: 90, min: 60, max: 120, menu: style } # x waist to seat, down the left side seam
  waistbandHeight: { pct: 3, min: 2, max: 6, of: waistToFloor, menu: style } # finished
  # Sarah's own: the length, and her straight skirt's darts and side seams, which the yoke and gores
  # replace (no menu: not shown)
  length: { pct: 90, min: 40, max: 100, menu: style } # x waist to floor: long, as Aldrich's figure
  centerFrontSeam: { bool: false }
  centerBackSeam: { bool: false }
  waistEaseFront: { pct: 10, min: 0, max: 20 }
  waistEaseBack: { pct: 17, min: 0, max: 30 }
  waistRise: { pct: 6, min: 0, max: 10 }
  sideSeamCurveOffset: { pct: 2.5, min: 0, max: 5 }
  backOutsideDartLength: { pct: 63, min: 50, max: 75 }
  backInsideDartLength: { pct: 68, min: 50, max: 75 }
  frontDartLength: { pct: 58, min: 40, max: 80 }

pieces:
  layout:
    from: sarah.base
    hide: tree
    options: all
    ops:
      - yokeLayout:
          depth: waistToSeat * hipYokeDepth
          flare: seat * goreEdgeFlare
          flareFrom: flareFrom
  frontYoke: { part: skirtYoke, which: front, after: layout, nr: 1 }
  backYoke: { part: skirtYoke, which: back, after: layout, nr: 2 }
  frontGore: { part: yokeGore, which: front, after: layout, nr: 3 }
  sideFront: { part: yokeGore, which: sideFront, after: layout, nr: 4, zip: waistToSeat * zipLength }
  sideBack: { part: yokeGore, which: sideBack, after: layout, nr: 5, zip: waistToSeat * zipLength }
  backGore: { part: yokeGore, which: back, after: layout, nr: 6 }
  waistband:
    part: strip
    after: layout
    nr: 7
    fold: true
    length: skirt.waist + waistToFloor * waistbandHeight
    width: waistToFloor * waistbandHeight
