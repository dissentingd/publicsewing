[project]
name = "ccat"
version = "0.1.0"
description = "Catalog pipeline: declarative drafting recipes -> validated pattern pieces"
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
export = ["shapely>=2.1", "ezdxf>=1.4", "reportlab>=4.4"]

[tool.setuptools]
packages = ["ccat", "ccat.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
