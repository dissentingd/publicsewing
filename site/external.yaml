# Patterns by others, listed in the Historical Designs page's category tables (Open+Pattern copies real
# garments) and linked, not hosted. Every
# entry's own page was read for its size and licence (CC BY 4.0, credit Open+Pattern) on 2026-11-03:
# check both when adding one. Write `about` in our own words; don't copy their text. Their renders
# from a held download (CC BY 4.0, corpus/openpattern/) may be shown, credited: a front view resized
# to site/illustrations/external/<path>.jpg gives the row its thumbnail.
# category: an id from designs/lib/categories.mjs. ours: our design drafted from this pattern.
# Left out, having no section: German Zeltbahn 31, Zeltbahn Hood, Hungarian Zeltbahn M49/82,
# British Boonie Hat, US Army Cold Weather Mask, Swiss M70/M79 backpack.
