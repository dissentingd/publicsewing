<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>PublicSewing</title>
  <style>
    .needle { fill: #2b2622; }
    .thread { fill: none; stroke: #b4552f; stroke-width: 5.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .needle { fill: #eee7dc; }
      .thread { stroke: #e08a5f; }
    }
  </style>
  <!-- PS: a slim upright needle, swelling a little to the right at its eye, and one thread: down from
       the S's top hook, in front of the needle into the eye, then out from behind it into the rest of the S -->
  <path class="thread" d="M20.5 14C17 24 56 26 56 44C56 58 38 60 30 51"/>
  <path class="needle" fill-rule="evenodd" d="M12.5 8Q12.5 2 20 2C25.5 2 28 7 28 14C28 21 25.5 26 23.5 31L15.5 64L12.5 31ZM20.5 6C17.8 6 17.8 22 20.5 22C23.2 22 23.2 6 20.5 6Z"/>
  <path class="thread" d="M56 15C49 5 30 5 20.5 14"/>
</svg>
